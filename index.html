<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하이클린 업무관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 좌측 고객목록 | 우측 작업영역(입력 + A4 미리보기). 확인서는 PDF로 저장해 인쇄 */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --field:#ffffff; --line:#d8dee6; --line2:#e8ecf1;
  --fg:#1b2430; --mute:#5d6878; --accent:#1d5fa8; --accent-weak:#e5eef9; --on-accent:#ffffff;
  --danger:#b4232c; --warn-bg:#fff5dc; --warn-fg:#6b4a00; --ok-bg:#e4f3ea; --ok-fg:#1f6b45; --bad-bg:#fdeaea; --bad-fg:#a3262d;
  --pv:#e1e6ed;
  --font:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-blue:#c5d9f1; --f-peach:#fce4d6; --f-line:#3a3a3a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --field:#121821; --line:#2c3542; --line2:#232b36;
  --fg:#e6ebf2; --mute:#9aa6b5; --accent:#6ea8ec; --accent-weak:#1c2c42; --on-accent:#0b1522;
  --danger:#f08a8f; --warn-bg:#3a2f12; --warn-fg:#f2d48a; --ok-bg:#16352a; --ok-fg:#8fd6b0; --bad-bg:#3d1c20; --bad-fg:#f3a3a8;
  --pv:#0d1117; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --field:#121821; --line:#2c3542; --line2:#232b36;
  --fg:#e6ebf2; --mute:#9aa6b5; --accent:#6ea8ec; --accent-weak:#1c2c42; --on-accent:#0b1522;
  --danger:#f08a8f; --warn-bg:#3a2f12; --warn-fg:#f2d48a; --ok-bg:#16352a; --ok-fg:#8fd6b0; --bad-bg:#3d1c20; --bad-fg:#f3a3a8;
  --pv:#0d1117; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;min-height:100vh}
header.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top h1{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px}
header.top h1 .logo{height:26px;background:#fff;border-radius:4px;padding:1px 3px}
header.top .sp{flex:1}
.mode{font-size:12px;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.body{display:grid;grid-template-columns:300px minmax(0,1fr);flex:1;min-height:0}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 56px);position:sticky;top:0}
.search{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line2)}
.search input,.search select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.search .row{display:flex;gap:6px;align-items:center;justify-content:space-between;color:var(--mute);font-size:12.5px}
.clist{overflow:auto;flex:1}
.citem{padding:10px 12px;border-bottom:1px solid var(--line2);cursor:pointer;display:grid;gap:3px}
.citem:hover{background:var(--accent-weak)}
.citem.sel{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.citem .n{font-weight:700}
.citem .s{font-size:12.5px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--line2);color:var(--mute)}
.tag.st-미수{background:var(--bad-bg);color:var(--bad-fg)}.tag.st-보류,.tag.st-미정{background:var(--warn-bg);color:var(--warn-fg)}.tag.st-확정{background:var(--accent-weak);color:var(--accent)}.tag.st-완료{background:var(--ok-bg);color:var(--ok-fg)}.tag.st-취소{text-decoration:line-through}
main{min-width:0}
.empty{padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));color:var(--mute);max-width:680px}
.empty h2{color:var(--fg);font-size:18px;margin:0 0 8px}
.empty p{margin:0 0 10px}
.chead{display:flex;align-items:center;gap:12px;padding:14px 20px 0;flex-wrap:wrap}
.chead h2{margin:0;font-size:19px}
.chead .meta{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:2px;padding:10px 20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:1px solid transparent;border-bottom:none;background:none;padding:8px 14px;border-radius:6px 6px 0 0;color:var(--mute)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--fg);font-weight:700;margin-bottom:-1px}
.work{display:grid;grid-template-columns:minmax(320px,430px) minmax(0,1fr);gap:20px;padding:16px 20px 40px;align-items:start}
.formcol{display:flex;flex-direction:column;gap:14px;min-width:0}
fieldset{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 14px 14px;margin:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;padding:0 4px;font-size:13.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:grid;gap:3px;font-size:12.5px;color:var(--mute);min-width:0}
label.f input,label.f select,label.f textarea{padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--field);color:var(--fg);width:100%;min-width:0}
label.f input[readonly]{background:transparent;border-style:dashed}
textarea{resize:vertical;min-height:52px}
.mapt{font-size:12.5px;color:var(--mute);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.previewcol{position:sticky;top:12px;min-width:0}
.previewcol .cap{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12.5px;margin-bottom:6px}
.pvwrap{background:var(--pv);border-radius:8px;padding:14px;overflow:hidden}
.pv{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);margin:0 auto;width:210mm}
.notice{background:var(--warn-bg);color:var(--warn-fg);padding:8px 12px;border-radius:6px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cform{padding:16px 20px;max-width:760px;display:grid;gap:14px}
table.ro{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.ro th,table.ro td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:top}
table.ro th{width:34%;color:var(--mute);font-weight:500;background:var(--bg)}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--panel);color:var(--fg)}
dialog::backdrop{background:rgba(10,16,24,.45)}
dialog .dh{padding:14px 18px;border-bottom:1px solid var(--line2);font-weight:700}
dialog .db{padding:14px 18px;display:grid;gap:10px;max-height:60vh;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
#pdfStage{position:fixed;left:-10000px;top:0;width:210mm;background:#fff}
#pdfStage .sheet{height:297mm;min-height:0;overflow:hidden}
@media (max-width:1100px){.work{grid-template-columns:minmax(0,1fr)}.previewcol{position:static}}
@media (max-width:760px){.body{grid-template-columns:minmax(0,1fr)}aside{max-height:42vh;position:static;border-right:none;border-bottom:1px solid var(--line)}.chead,.tabs,.work,.cform{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}


[hidden]{display:none!important}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:6px;color:var(--mute);font-weight:500}
.nav button.on{background:var(--accent-weak);color:var(--accent);font-weight:700}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:40;padding:16px}
.loginbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(360px,100%);display:grid;gap:12px}
.loginbox h2{margin:0;font-size:18px}.loginbox .logo{height:40px;justify-self:start;background:#fff;border-radius:4px;padding:2px 4px}
.cards{display:grid;gap:10px;padding:16px 20px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.card .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.card .d{font-size:13px;color:var(--mute);display:flex;gap:6px 12px;flex-wrap:wrap}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 20px 0}
.toolbar select,.toolbar input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.badge{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;font-weight:700;background:var(--line2);color:var(--mute)}
.badge.install{background:var(--ok-bg);color:var(--ok-fg)}.badge.as{background:var(--bad-bg);color:var(--bad-fg)}
.badge.s-접수{background:var(--warn-bg);color:var(--warn-fg)}.badge.s-배정{background:var(--accent-weak);color:var(--accent)}.badge.s-완료{background:var(--ok-bg);color:var(--ok-fg)}.badge.s-취소{text-decoration:line-through}
.money{font-variant-numeric:tabular-nums}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:13px;cursor:pointer}
dialog{max-width:720px}
.stafft{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel)}
.stafft td,.stafft th{padding:6px 6px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
.stafft input,.stafft select{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--field);width:100%;min-width:70px}
.wrapx{overflow-x:auto;padding:0 20px}
.sec{padding:16px 20px;display:grid;gap:12px;max-width:900px}
@media (max-width:760px){.g3{grid-template-columns:1fr 1fr}.toolbar,.cards,.wrapx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
/* ================= A4 양식 ================= */
.sheet{width:210mm;min-height:297mm;padding:9mm 9mm 8mm;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111;font-size:9.6pt;line-height:1.25;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;display:flex;flex-direction:column}
.sheet .tophd{display:flex;justify-content:space-between;font-size:7.6pt;color:#555;border-bottom:.3mm solid #999;padding-bottom:1.2mm}
.sheet .ttl{text-align:center;font-family:"HY헤드라인M","HYHeadLine-Medium","Malgun Gothic",sans-serif;font-size:23pt;letter-spacing:2mm;margin:4mm 0 3mm;font-weight:500}
.sheet .intro{background:var(--f-peach);text-align:center;font-weight:700;font-size:8.8pt;padding:2.2mm 4mm;line-height:1.6}
.sheet table.ft{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:3.2mm;border:.45mm solid var(--f-line)}
.sheet table.ft td{border:.2mm solid #555;height:6.3mm;padding:.4mm 1.6mm;vertical-align:middle;overflow:hidden;word-break:keep-all}
.sheet td.sec{background:var(--f-blue);font-weight:700;text-align:center;line-height:1.5;white-space:pre-line;border-right:.45mm solid var(--f-line)}
.sheet td.lb{background:var(--f-blue);font-weight:700;text-align:center;white-space:nowrap}
.sheet td.hd{background:var(--f-blue);font-weight:700;text-align:center;letter-spacing:1.2mm}
.sheet td.v{font-weight:400}
.sheet td.c{text-align:center}
.sheet td.r{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.it{font-weight:700;font-size:9pt}
.sheet td.multi{white-space:pre-wrap;height:auto;min-height:6.3mm}
.sheet td.pay{font-weight:700;text-align:center;font-size:9.6pt;line-height:1.6;padding:1.4mm}
.sheet td.tot{font-weight:700}
.sheet .cb{display:inline-block;width:3.1mm;height:3.1mm;border:.25mm solid #222;vertical-align:-.45mm;margin-right:.8mm;position:relative;background:#fff}
.sheet .cb.on::after{content:"";position:absolute;left:.85mm;top:.05mm;width:1mm;height:2mm;border:solid #0b3d91;border-width:0 .55mm .55mm 0;transform:rotate(45deg)}
.sheet .cbs{display:flex;flex-wrap:wrap;gap:.6mm 3.2mm;justify-content:center;font-weight:700;font-size:9pt}
.sheet .stmt{display:flex;justify-content:space-between;margin:4.5mm 6mm 2mm;font-size:9.8pt}
.sheet .stmt .d{display:flex;gap:6mm;min-width:62mm;justify-content:flex-end}
.sheet .stmt .d span{display:inline-block;min-width:9mm;text-align:right}
.sheet .sign{display:grid;grid-template-columns:1fr 1fr;row-gap:2mm;margin:2mm 6mm 0;font-weight:700;font-size:10pt}
.sheet .sign > div{display:flex;align-items:flex-end;gap:2mm;min-height:9mm}
.sheet .sign .ln{flex:1;border-bottom:.2mm solid #777;padding:0 1mm .6mm;font-weight:400}
.sheet .sign .in{color:#333;font-weight:400}
.sheet .foot{margin-top:auto;border-top:.3mm solid #999;padding-top:3mm;display:grid;grid-template-columns:44mm 1fr 26mm;align-items:center;gap:4mm;font-size:8pt;color:#222;line-height:1.55}
.sheet .foot img.logo{width:40mm}
.sheet .foot img.seal{width:22mm;justify-self:end}
.sheet .blank{color:transparent}

#printRoot{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff;height:auto}
  .app,dialog,.toast{display:none!important}
  #printRoot{display:block}
  #printRoot .sheet{height:297mm;min-height:0;overflow:hidden;page-break-after:always;break-after:page}
  #printRoot .sheet:last-child{page-break-after:auto;break-after:auto}
}

.sheet{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#printRoot{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff}
  .app,dialog,.toast,.login{display:none!important}
  #printRoot{display:block}
  #printRoot .sheet{height:297mm;min-height:0;overflow:hidden}
}
</style>
</head>

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function p2(n){return String(n).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function won(n){n=Number(String(n??"").replace(/[^\d-]/g,""));return n?n.toLocaleString("ko-KR"):""}
function num(v){return Number(String(v??"").replace(/[^\d-]/g,""))||0}
function kdate(s){if(!s)return"";const m=String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return m?`${m[1]}. ${+m[2]}. ${+m[3]}.`:s}
function ymd(s){const m=String(s||"").match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return m?[m[1],+m[2],+m[3]]:["","",""]}
function fmtPhone(v){
  let d=String(v??"").replace(/\D/g,"");
  if(/^1\d{8,9}$/.test(d))d="0"+d;               // 엑셀에서 앞자리 0이 빠진 경우
  if(d.startsWith("02")){if(d.length===9)return d.replace(/(02)(\d{3})(\d{4})/,"$1-$2-$3");if(d.length===10)return d.replace(/(02)(\d{4})(\d{4})/,"$1-$2-$3")}
  if(d.length===11)return d.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3");
  if(d.length===10)return d.replace(/(\d{3})(\d{3})(\d{4})/,"$1-$2-$3");
  if(d.length===8)return d.replace(/(\d{4})(\d{4})/,"$1-$2");
  return String(v??"").trim();
}
function fmtBiz(v){const d=String(v??"").replace(/\D/g,"");return d.length===10?d.replace(/(\d{3})(\d{2})(\d{5})/,"$1-$2-$3"):String(v??"").trim()}
function toDate(v){
  if(v==null||v==="")return"";
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())}
  const s=String(v).trim();let m=s.match(/^(\d{4})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})/);
  if(m)return m[1]+"-"+p2(m[2])+"-"+p2(m[3]);
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/);if(m)return "20"+m[1]+"-"+p2(m[2])+"-"+p2(m[3]);
  return s;
}

async function fetchAll(table,select="*"){
  const out=[];const step=1000;
  for(let from=0;;from+=step){const {data,error}=await sb.from(table).select(select).range(from,from+step-1);if(error)throw error;out.push(...data);if(data.length<step)break}
  return out;
}
async function loadAll(){
  view().innerHTML=`<div class="empty"><h2>불러오는 중…</h2></div>`;
  try{
    [staff,customers,contracts,jobs]=await Promise.all([fetchAll("staff","user_id,name,role,aliases,active"),fetchAll("customers"),fetchAll("contracts"),fetchAll("jobs")]);
    const st=await sb.from("settings").select("bank").eq("id",1).maybeSingle();if(st.data&&st.data.bank)S.bank=st.data.bank;
  }catch(e){view().innerHTML=`<div class="empty"><h2>데이터를 불러오지 못했습니다</h2><p>${esc(e.message||"")}</p><p>1단계 데이터베이스 설정(phase1.sql)을 실행했는지 확인해 주세요.</p></div>`;return}
  if(ui.sel&&!custById(ui.sel))ui.sel=null;
  buildIdx();render();
}
async function reload(tables){
  const m={customers:()=>fetchAll("customers"),contracts:()=>fetchAll("contracts"),jobs:()=>fetchAll("jobs"),staff:()=>fetchAll("staff","user_id,name,role,aliases,active")};
  for(const t of tables){const d=await m[t]();if(t==="customers")customers=d;if(t==="contracts")contracts=d;if(t==="jobs")jobs=d;if(t==="staff")staff=d}

}

function renderConf(c){

  const base={상호:c.name,사업장명:c.biz_name,전화:c.phone||c.phone2,사업자번호:c.biz_no,설치장소:c.address,고객명:c.ceo,모델명:k?k.product:"",사이즈:k?k.size:"",옵션:k?k.options:"",SN:k?k.serial:"",구매일자:k?k.contract_date:"",설치일자:installDate(c.id)};
  if(!ui.draft||ui.draft.type!==ui.conf.type||ui.draft._k!==ui.conf.kid){
    ui.draft=ui.conf.type==="as"?{type:"as",접수일자:today(),불편사항:"",업장명:c.biz_name||c.name,cust:base,_k:ui.conf.kid}:{type:"is",신청일자:base.구매일자,설치일자:base.설치일자,업장명:c.biz_name||c.name,cust:base,_k:ui.conf.kid}}
  const d=ui.draft;const fl=(k,l,v,t="text")=>`<label class="f">${l}<input type="${t}" data-k="${k}" value="${esc(v||"")}"></label>`;
  tb.innerHTML=`<div class="toolbar"><div class="nav"><button type="button" class="${ui.conf.type==="as"?"on":""}" data-ct="as">A/S 확인서</button><button type="button" class="${ui.conf.type==="is"?"on":""}" data-ct="is">설치확인서</button></div>
    ${ks.length>1?`<select id="cfK">${ks.map(x=>`<option value="${x.id}" ${x.id===ui.conf.kid?"selected":""}>${esc([x.contract_date,x.product,x.size,x.serial].filter(Boolean).join(" · "))}</option>`).join("")}</select>`:""}</div>

    <div class="g2">${fl("c.상호","상호",d.cust.상호)}${fl("c.전화","전화번호",d.cust.전화)}</div>
    <div class="g2">${fl("c.사업장명","사업장명",d.cust.사업장명)}${fl("c.사업자번호","사업자번호",d.cust.사업자번호)}</div>${fl("c.설치장소","설치장소",d.cust.설치장소)}
    ${d.type==="as"?`<div class="g2">${fl("접수일자","접수일자",d.접수일자,"date")}${fl("c.SN","제품 SN",d.cust.SN)}</div><div class="g2">${fl("c.구매일자","구매일자",d.cust.구매일자,"date")}${fl("c.설치일자","설치일자",d.cust.설치일자,"date")}</div><label class="f">불편사항<textarea data-k="불편사항" rows="2">${esc(d.불편사항)}</textarea></label>`
     :`<div class="g2">${fl("c.모델명","제품",d.cust.모델명)}${fl("c.SN","제품 SN",d.cust.SN)}</div><div class="g2">${fl("c.사이즈","사이즈",d.cust.사이즈)}${fl("c.옵션","옵션",d.cust.옵션)}</div><div class="g2">${fl("신청일자","신청일자",d.신청일자,"date")}${fl("설치일자","설치일자",d.설치일자,"date")}</div>`}
    </fieldset><fieldset><legend>서명란</legend>${fl("업장명","업장명",d.업장명)}</fieldset>
    <p class="mapt">2번·3번 항목, 확인 날짜, 고객명과 출장기사 서명은 빈칸으로 인쇄되어 현장에서 직접 적습니다.</p>
    <div class="actions"><button class="btn pri" id="bOut" type="button">인쇄</button></div></div>
    <div class="previewcol"><div class="cap"><span>미리보기 (A4)</span></div><div class="pvwrap" id="pvwrap"><div class="pv" id="pv"></div></div></div></div>`;
  tb.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{ui.conf.type=b.dataset.ct;ui.draft=null;renderConf(c)});
  const kk=document.getElementById("cfK");if(kk)kk.onchange=e=>{ui.conf.kid=e.target.value;ui.draft=null;renderConf(c)};
  const fc=document.getElementById("fcol");const on=e=>{const t=e.target;if(!t.dataset.k)return;const key=t.dataset.k;if(key.startsWith("c."))d.cust[key.slice(2)]=t.value;else d[key]=t.value;pv()};
  fc.addEventListener("input",on);fc.addEventListener("change",on);
  const pr=()=>{const r={접수일자:d.접수일자,불편사항:d.불편사항,신청일자:d.신청일자,설치일자:d.설치일자,업장명:d.업장명};return d.type==="as"?sheetAS(r,d.cust):sheetIS(r,d.cust)};
  const pv=()=>{const el=document.getElementById("pv");if(!el)return;el.innerHTML=pr();const w=document.getElementById("pvwrap");el.style.zoom=1;el.style.zoom=Math.min(1,(w.clientWidth-28)/el.offsetWidth)};
  document.getElementById("bOut").onclick=()=>doPrint(pr());pv();
}

  let parsed=null;

   <p class="mapt">엑셀 한 줄이 계약 1건과 설치 작업 1건이 됩니다. 같은 사업자번호 또는 같은 업체명·휴대번호는 한 고객으로 묶습니다. 입금 정보는 원본 그대로 보관했다가 2단계(입금·미수)에서 옮깁니다.</p>
   ${isAdmin()&&customers.length?`<label class="chip"><input type="checkbox" id="rpl">지금 고객·계약·작업을 모두 지우고 이 엑셀로 새로 이관</label>`:""}`,
   [["취소"],["이관","pri",async()=>{const rpl=document.getElementById("rpl")?.checked;await runImport(rpl?planImport(parsed,true):plan,rpl)}]]);

function parseSheet(rows,hr){
  const H=rows[hr].map(h=>String(h||"").trim());
  const ix=(n,k=0)=>{let c=-1;for(let i=0;i<H.length;i++)if(H[i]===n&&++c===k)return i;return -1};
  const out=[];
  rows.slice(hr+1).forEach(row=>{
    if(!row.some(v=>String(v).trim()!==""))return;
    const g=(n,k=0)=>{const i=ix(n,k);return i<0?"":row[i]};const t=(n,k=0)=>{const v=g(n,k);return v instanceof Date?toDate(v):String(v??"").trim()};
    if(!t("업체명"))return;
    const raw={};H.forEach((h,i)=>{if(!h)return;let key=h,n=2;while(key in raw)key=h+"#"+(n++);const v=row[i];raw[key]=v instanceof Date?toDate(v):v});
    out.push({t,g,raw});
  });
  return out;
}
function money(v){if(v==null)return 0;if(typeof v==="number")return Math.round(v);const s=String(v).replace(/[^\d-]/g,"");return s&&s!=="-"?Number(s):0}
function custKey(c){const d=String(c.biz_no||"").replace(/\D/g,"");return d.length===10?"b:"+d:"n:"+nk(c.name)+"|"+String(c.phone||c.phone2||"").replace(/\D/g,"")}
function planImport(rows,fresh){
  const exCust=fresh?[]:customers,exCtr=fresh?[]:contracts;
  const byKey={};exCust.forEach(c=>byKey[custKey(c)]=c);
  const serials=new Set(exCtr.map(k=>nk(k.serial)).filter(Boolean));
  const sig=new Set(exCtr.map(k=>k.customer_id+"|"+nk(k.product)+"|"+(k.contract_date||"")+"|"+k.amount));
  const newCust=[],newCtr=[],newJob=[];let skipped=0;const td=today();
  rows.forEach(({t,g,raw})=>{
    let name=t("업체명");const notes=[];
    const ft=name.match(/\s*\(([^)]*체험[^)]*)\)\s*$/);let trial="";if(ft){trial=ft[1].replace(/무료체험\s*/,"").trim()||"예";name=name.replace(ft[0],"").trim()}
    const om=name.match(/\s*\(([^)]*(오픈|예정)[^)]*)\)\s*$/);if(om){notes.push(om[1]);name=name.replace(om[0],"").trim()}
    let bizRaw=t("사업자등록번호"),bd=bizRaw.replace(/\D/g,"");let biz="";
    if(/^(없음|-|x|해당없음)?$/i.test(bizRaw))biz="";else if(bd.length>=9){if(bd.length===9)bd="0"+bd;biz=fmtBiz(bd)}else notes.push("사업자번호칸: "+bizRaw);
    let phone=fmtPhone(t("휴대번호")),phone2=fmtPhone(t("일반전화"));if(!phone&&phone2){phone=phone2;phone2=""}if(phone2===phone)phone2="";
    const s3=t("3차");const s3clean=["무료체험","보상판매"].includes(s3)?"":s3;
    const cu={id:crypto.randomUUID(),name,ceo:t("대표자"),phone,phone2,biz_no:biz,address:t("상점주소"),owner_name:s3clean,memo:""};
    const key=custKey(cu);let cust=byKey[key];
    if(!cust){cust=cu;byKey[key]=cu;newCust.push(cu)}
    // 계약
    const stRaw=t("진행단계");let stage=STAGES.includes(stRaw)?stRaw:"확정";if(stRaw&&!STAGES.includes(stRaw))notes.push("진행단계: "+stRaw);
    const s2=t("2차");if(s2==="무료체험"&&!trial)trial="예";
    let size=t("사이즈"),opts=[];if(/수압식/.test(size))size="";else{const z=size.match(/^(\d+(?:\s*[*xX×]\s*\d+)?)\s*(무|좌)?/);if(z){size=z[1].replace(/\s/g,"");if(z[2]==="무")opts.push("무턱");if(z[2]==="좌")opts.push("좌배수")}}
    const p1=g("부자재",0),p2=g("부자재",1);const partsText=typeof p1==="string"&&!/^[\d,\s-]*$/.test(p1)?p1.trim():"";
    const amtParts=partsText?money(p2):money(p1);
    const ap=t("승인처");const monthly=money(g("월할부금"));
    let pay="";if(/CMS/i.test(stRaw))pay="CMS";else if(/캐피탈|하나/.test(ap)||monthly)pay="캐피탈";else if(/\+\s*현금/.test(ap))pay="카드+현금";else if(ap==="현금")pay="현금";else if(ap)pay="카드";
    const doc=t("계약서");const iss=g("발급일");
    const tax=iss instanceof Date?{type:"세금계산서",date:toDate(iss),supply:money(g("공급가액")),vat:money(g("부가세")),total:money(g("합계금액",2))}:(String(iss||"").trim()?{type:String(iss).trim()}:{});
    const sm=t("정산년월").match(/(\d{2,4})\s*년\s*(\d{1,2})\s*월/);
    const memo=[t("비고"),...notes].filter(Boolean).join(" / ");
    const k={id:crypto.randomUUID(),customer_id:cust.id,contract_date:toDate(g("계약일자"))||null,stage,channel:t("구분"),referrer:t("소개"),sales1:t("1차"),sales2:["무료체험","보상판매"].includes(s2)?"":s2,sales3_name:s3clean,free_trial:trial,
      product:t("제품")==="수압식"?"수압식":t("제품"),size,options:opts.join(", "),serial:t("시리얼"),wash_added:!!t("수압식")||t("제품")==="수압식",
      amt_ultra:money(g("초음파")),amt_wash:money(g("워시")),amt_parts:amtParts,amount:money(g("합계금액",0)),pay_method:pay,contract_doc:doc==="○"?"사진":doc==="●"?"원본":"미수령",
      capital:(pay==="캐피탈"?{company:ap,approver:t("승인자"),monthly,interest:money(g("이자")),months:money(g("기간")),total:money(g("합계"))}:{}),
      cms:pay==="CMS"?{day:((stRaw.match(/(\d+)\s*일/)||[])[1]||"")}:{},tax,settle_month:sm?`${sm[1].length===2?"20"+sm[1]:sm[1]}-${sm[2].padStart(2,"0")}`:"",memo,import_raw:raw};
    if(!k.amount)k.amount=k.amt_ultra+k.amt_wash+k.amt_parts;
    const sg=k.customer_id+"|"+nk(k.product)+"|"+(k.contract_date||"")+"|"+k.amount;
    if((k.serial&&serials.has(nk(k.serial)))||sig.has(sg)){skipped++;return}
    if(k.serial)serials.add(nk(k.serial));sig.add(sg);newCtr.push(k);
    // 설치 작업
    const vd=toDate(g("설치일자"))||null;const tn=t("설치1");
    let status=stage==="취소"?"취소":(vd&&vd<=td?"완료":(vd||tn?"배정":"접수"));
    const sinkRaw=t("싱크준비")||t("싱크발주");
    newJob.push({id:crypto.randomUUID(),kind:"install",customer_id:cust.id,contract_id:k.id,customer_name:cust.name,address:cust.address,product:productOf(k),status,request_date:k.contract_date||vd||td,visit_date:vd,visit_time:t("시간"),
      techs:[],tech_names:tn,symptom:"",result:"",cost:0,sink_status:SINKS.includes(sinkRaw)?sinkRaw:(sinkRaw?"기타":""),sink_memo:SINKS.includes(sinkRaw)?"":sinkRaw,parts:partsText,done_date:status==="완료"?vd:null});
  });
  return{newCust,newCtr,newJob,skipped};
}
async function runImport(plan,replace){
  try{
    if(replace){for(const tb of ["jobs","contracts","customers"]){const {error}=await sb.from(tb).delete().not("id","is",null);if(error)throw error}}
    const put=async(tb,rows)=>{for(let i=0;i<rows.length;i+=300){toast(`이관 중… ${tb==="customers"?"고객":tb==="contracts"?"계약":"작업"} ${Math.min(i+300,rows.length)}/${rows.length}`);const {error}=await sb.from(tb).insert(rows.slice(i,i+300));if(error)throw error}};
    await put("customers",plan.newCust);await put("contracts",plan.newCtr);await put("jobs",plan.newJob);
    await sb.rpc("link_staff_names");
    toast(`이관 완료: 고객 ${plan.newCust.length} · 계약 ${plan.newCtr.length} · 작업 ${plan.newJob.length}`);
    ui.sel=null;await loadAll();
  }catch(e){toast("이관 중 멈췄습니다: "+(e.message||""));await loadAll()}
}

/* ================= 공통 ================= */
function fdata(id){const root=document.getElementById(id);const els=[...root.querySelectorAll("[name]")];
  const one=n=>{const e=els.filter(x=>x.name===n);if(!e.length)return null;const x=e[0];if(x.type==="checkbox")return x.checked?(x.value||"on"):null;return x.value};
  return{get:one,getAll:n=>els.filter(x=>x.name===n&&x.type==="checkbox"&&x.checked).map(x=>x.value)}}
function val(id){const el=document.getElementById(id);return el?el.value:""}
function openDlg(h,b,btns){
  const d=document.getElementById("dlg");document.getElementById("dlgH").innerHTML=h;document.getElementById("dlgB").innerHTML=b;
  const f=document.getElementById("dlgF");f.innerHTML="";
  btns.forEach(([t,cls,fn])=>{const x=document.createElement("button");x.className="btn "+(cls||"");x.textContent=t;x.onclick=async ev=>{ev.preventDefault();if(fn){const keep=await fn();if(keep===true)return}d.close()};f.appendChild(x)});
  if(!d.open)d.showModal();
}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3000);return true}
init();
</script>
