<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하이클린 업무관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 좌측 고객목록 | 우측 작업영역(입력 + A4 미리보기). 확인서는 PDF로 저장해 인쇄 */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --field:#ffffff; --line:#d8dee6; --line2:#e8ecf1;
  --fg:#1b2430; --mute:#5d6878; --accent:#1d5fa8; --accent-weak:#e5eef9; --on-accent:#ffffff;
  --danger:#b4232c; --warn-bg:#fff5dc; --warn-fg:#6b4a00; --ok-bg:#e4f3ea; --ok-fg:#1f6b45; --bad-bg:#fdeaea; --bad-fg:#a3262d;
  --pv:#e1e6ed;
  --font:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-blue:#c5d9f1; --f-peach:#fce4d6; --f-line:#3a3a3a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --field:#121821; --line:#2c3542; --line2:#232b36;
  --fg:#e6ebf2; --mute:#9aa6b5; --accent:#6ea8ec; --accent-weak:#1c2c42; --on-accent:#0b1522;
  --danger:#f08a8f; --warn-bg:#3a2f12; --warn-fg:#f2d48a; --ok-bg:#16352a; --ok-fg:#8fd6b0; --bad-bg:#3d1c20; --bad-fg:#f3a3a8;
  --pv:#0d1117; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --field:#121821; --line:#2c3542; --line2:#232b36;
  --fg:#e6ebf2; --mute:#9aa6b5; --accent:#6ea8ec; --accent-weak:#1c2c42; --on-accent:#0b1522;
  --danger:#f08a8f; --warn-bg:#3a2f12; --warn-fg:#f2d48a; --ok-bg:#16352a; --ok-fg:#8fd6b0; --bad-bg:#3d1c20; --bad-fg:#f3a3a8;
  --pv:#0d1117; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;min-height:100vh}
header.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top h1{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px}
header.top h1 .logo{height:26px;background:#fff;border-radius:4px;padding:1px 3px}
header.top .sp{flex:1}
.mode{font-size:12px;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.body{display:grid;grid-template-columns:300px minmax(0,1fr);flex:1;min-height:0}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 56px);position:sticky;top:0}
.search{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line2)}
.search input,.search select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.search .row{display:flex;gap:6px;align-items:center;justify-content:space-between;color:var(--mute);font-size:12.5px}
.clist{overflow:auto;flex:1}
.citem{padding:10px 12px;border-bottom:1px solid var(--line2);cursor:pointer;display:grid;gap:3px}
.citem:hover{background:var(--accent-weak)}
.citem.sel{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.citem .n{font-weight:700}
.citem .s{font-size:12.5px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--line2);color:var(--mute)}
.tag.st-미수{background:var(--bad-bg);color:var(--bad-fg)}.tag.st-보류,.tag.st-미정{background:var(--warn-bg);color:var(--warn-fg)}.tag.st-확정{background:var(--accent-weak);color:var(--accent)}.tag.st-완료{background:var(--ok-bg);color:var(--ok-fg)}.tag.st-취소{text-decoration:line-through}
main{min-width:0}
.empty{padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));color:var(--mute);max-width:680px}
.empty h2{color:var(--fg);font-size:18px;margin:0 0 8px}
.empty p{margin:0 0 10px}
.chead{display:flex;align-items:center;gap:12px;padding:14px 20px 0;flex-wrap:wrap}
.chead h2{margin:0;font-size:19px}
.chead .meta{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:2px;padding:10px 20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:1px solid transparent;border-bottom:none;background:none;padding:8px 14px;border-radius:6px 6px 0 0;color:var(--mute)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--fg);font-weight:700;margin-bottom:-1px}
.work{display:grid;grid-template-columns:minmax(320px,430px) minmax(0,1fr);gap:20px;padding:16px 20px 40px;align-items:start}
.formcol{display:flex;flex-direction:column;gap:14px;min-width:0}
fieldset{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 14px 14px;margin:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;padding:0 4px;font-size:13.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:grid;gap:3px;font-size:12.5px;color:var(--mute);min-width:0}
label.f input,label.f select,label.f textarea{padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--field);color:var(--fg);width:100%;min-width:0}
label.f input[readonly]{background:transparent;border-style:dashed}
textarea{resize:vertical;min-height:52px}
.mapt{font-size:12.5px;color:var(--mute);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.previewcol{position:sticky;top:12px;min-width:0}
.previewcol .cap{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12.5px;margin-bottom:6px}
.pvwrap{background:var(--pv);border-radius:8px;padding:14px;overflow:hidden}
.pv{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);margin:0 auto;width:210mm}
.notice{background:var(--warn-bg);color:var(--warn-fg);padding:8px 12px;border-radius:6px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cform{padding:16px 20px;max-width:760px;display:grid;gap:14px}
table.ro{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.ro th,table.ro td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:top}
table.ro th{width:34%;color:var(--mute);font-weight:500;background:var(--bg)}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--panel);color:var(--fg)}
dialog::backdrop{background:rgba(10,16,24,.45)}
dialog .dh{padding:14px 18px;border-bottom:1px solid var(--line2);font-weight:700}
dialog .db{padding:14px 18px;display:grid;gap:10px;max-height:60vh;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
#pdfStage{position:fixed;left:-10000px;top:0;width:210mm;background:#fff}
#pdfStage .sheet{height:297mm;min-height:0;overflow:hidden}
@media (max-width:1100px){.work{grid-template-columns:minmax(0,1fr)}.previewcol{position:static}}
@media (max-width:760px){.body{grid-template-columns:minmax(0,1fr)}aside{max-height:42vh;position:static;border-right:none;border-bottom:1px solid var(--line)}.chead,.tabs,.work,.cform{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}


.tag.ct-무료체험,.tag.ct-무상임대,.tag.ct-경품,.tag.ct-무상증정{background:#efe2ff;color:#6b21a8}.tag.st-철거{background:#fde2e2;color:#b42318}

[hidden]{display:none!important}
.badge.remove{background:#fde2e2;color:#b42318}.badge.addon{background:#fff3c4;color:#8a5a00}.badge.as{background:#efe2ff;color:#6b21a8}
.sumt{border-collapse:collapse;font-size:13px;background:var(--panel)}
.sumt th,.sumt td{border:1px solid var(--line);padding:5px 12px;text-align:right;min-width:64px}
.sumt thead th{text-align:center;font-weight:700}
.sumt tbody th{text-align:left;font-weight:500;color:var(--mute);background:var(--panel)}
.sumt td.cl{cursor:pointer}.sumt td.cl:hover{background:var(--accent-weak)}.sumt td.on{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.sumt tr.open td,.sumt tr.open th{font-weight:700;background:var(--warn-bg);color:var(--warn-fg)}
.sumt .k-as{background:#efe2ff;color:#6b21a8}.sumt .k-install{background:var(--ok-bg);color:var(--ok-fg)}.sumt .k-remove{background:#fde2e2;color:#b42318}.sumt .k-addon{background:#fff3c4;color:#8a5a00}
.sumwrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:14px 20px 0}
.wt{border-collapse:separate;border-spacing:0;font-size:12.5px;background:var(--panel);white-space:nowrap}
.wt th{position:sticky;top:0;z-index:1;background:var(--line2);font-weight:700;padding:6px 7px;border-bottom:1px solid var(--line);text-align:left}
.wt td{padding:5px 7px;border-bottom:1px solid var(--line2);vertical-align:middle}
.wt tbody tr{cursor:pointer}.wt tbody tr:hover td{background:var(--accent-weak)}
.wt td.wrap{white-space:normal;min-width:160px;max-width:280px}
.wt td.kc{font-weight:700;text-align:center}
.wt .k-as{background:#efe2ff;color:#6b21a8}.wt .k-install{background:var(--ok-bg);color:var(--ok-fg)}.wt .k-remove{background:#fde2e2;color:#b42318}.wt .k-addon{background:#fff3c4;color:#8a5a00}
.wt td.due{color:var(--accent);font-weight:700}.wt td.late{color:var(--bad-fg);font-weight:700}
.wtbox{max-height:calc(100vh - 260px);overflow:auto;border:1px solid var(--line);border-radius:6px}
.sumt th{white-space:nowrap}
.wrapx.vis{overflow:visible}
.pedit input,.pedit select{width:100%;min-width:0;padding:4px 6px;border:1px solid var(--accent);border-radius:5px;background:var(--field)}.pedit td{background:var(--accent-weak)}
.kpi.kc{cursor:pointer}.kpi.kc:hover{border-color:var(--accent)}.kpi.kc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak);background:var(--accent-weak)}
.gbadge{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:9px;margin-left:4px;vertical-align:1px;color:#fff}.gbadge.g-red{background:#e8590c}.gbadge.g-black{background:#1f1f1f}
.gwarn{margin:0;padding:6px 10px;border-radius:6px;font-size:13px;font-weight:600}.gwarn.g-red{background:#fff0e6;color:#b4410a}.gwarn.g-black{background:#2b2b2b;color:#fff}
#dlgF .gocust{margin-right:auto}
.trial.late{color:var(--bad-fg);font-weight:700}.trial.soon{color:var(--warn-fg);font-weight:700}
.autocalc{background:var(--ok-bg)!important;transition:background .3s}
.rofield{background:var(--line2)!important;color:var(--fg);cursor:default}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 20px;border:2px dashed transparent;border-radius:10px;margin:0 8px}
.fgrid.sm{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));padding:8px 0;margin:0}
.fgrid.drop{border-color:var(--accent);background:var(--accent-weak)}
.fth{position:relative;display:grid;grid-template-rows:1fr auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0;overflow:hidden;cursor:pointer;aspect-ratio:3/4;text-align:left;font:inherit;color:inherit}
.fth:hover,.fth:focus-visible{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
.fth img{width:100%;height:100%;object-fit:cover;min-height:0;background:var(--line2)}
.fpdf{display:grid;place-items:center;background:var(--line2);color:var(--mute);font-weight:700;font-size:18px;min-height:0;height:100%}
.fpdf.big{width:160px;height:200px;margin:0 auto 12px;border-radius:8px}
.fcap{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;font-size:12px;color:var(--mute);border-top:1px solid var(--line2)}.fcap b{color:var(--fg)}
.fx{position:absolute;top:4px;right:4px;z-index:1;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:22px;padding:0}
.nfiles{padding:8px 12px;border:1px solid var(--line);border-radius:8px}
#lbx{max-width:min(1100px,96vw);width:96vw;height:92vh;padding:0;background:#111;border:0;color:#eee}#lbx::backdrop{background:rgba(0,0,0,.75)}
#lbx .lbtop .btn{background:#2c2c2c;color:#fff;border-color:#555}#lbx .lbtop .btn.danger{color:#ff9b9b;border-color:#7a3b3b}
.fgrid.sm .fcap{display:block;line-height:1.35}.fgrid.sm .fcap b{display:block}
.lbwrap{display:grid;grid-template-rows:auto 1fr;height:100%}.lbtop{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#1d1d1d}.lbcap{font-size:14px}
.lbmid{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;min-height:0}.lbimg{height:100%;min-height:0;display:grid;place-items:center;text-align:center;overflow:auto;padding:8px}
.lbimg img{max-width:100%;max-height:calc(92vh - 80px);object-fit:contain}
.lbnav{height:80px;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:36px;border-radius:8px;margin:0 6px;cursor:pointer}.lbnav:disabled{opacity:.2;cursor:default}
.wt thead th{position:sticky}.wt .rz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:2;touch-action:none}
.wt .rz::after{content:"";position:absolute;left:3px;top:20%;height:60%;border-left:1px solid var(--line)}.wt .rz:hover::after{border-left:2px solid var(--accent)}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none}
.hastip{border-bottom:1px dashed currentColor;cursor:help;position:relative;padding-right:9px}
.hastip::after{content:"";position:absolute;right:0;top:1px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
#tipbox{position:fixed;z-index:1000;max-width:280px;background:#1f2937;color:#fff;font-size:13px;line-height:1.5;padding:7px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:pre-wrap;pointer-events:none}
.ksec{font-size:16px;font-weight:700;margin:14px 0 -2px;padding:2px 0 6px 10px;border-left:4px solid var(--accent);border-bottom:1px solid var(--line);color:var(--fg)}
#kf>.ksec:first-child{margin-top:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bizup{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--accent-weak)}
.bizup [data-pv],.bizup details{flex-basis:100%}.rawtxt{white-space:pre-wrap;font-size:12px;max-height:200px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;margin:4px 0 0}.bizup img{max-height:160px;max-width:100%;border:1px solid var(--line);border-radius:4px}
.bizrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}.bizrow .bizup{flex:1 1 100%}
@media (hover:hover) and (pointer:fine){.wtbox.hb{overflow-x:hidden}}
.wt.ct tr.rs-완료 td{background:#E2EFDA;color:#1b1b1b}.wt.ct tr.rs-미수 td{background:#FFE699;color:#1b1b1b}.wt.ct tr.rs-철거 td,.wt.ct tr.rs-보류 td,.wt.ct tr.rs-취소 td{background:#D9D9D9;color:#1b1b1b}
.wt.ct tr.rs-완료:hover td{background:#cfe4c2}.wt.ct tr.rs-미수:hover td{background:#ffdb70}.wt.ct tr.rs-철거:hover td,.wt.ct tr.rs-보류:hover td,.wt.ct tr.rs-취소:hover td{background:#c8c8c8}
.wt.ct tr[class^="rs-"] td.memo{color:#444}
.hbar{position:sticky;bottom:0;z-index:5;overflow-x:scroll;scrollbar-color:var(--mute) var(--line2);overflow-y:hidden;height:18px;background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px}
.hbar>div{height:1px}
.hbar::-webkit-scrollbar{height:14px}.hbar::-webkit-scrollbar-thumb{background:var(--mute);border-radius:7px;border:3px solid var(--panel)}.hbar::-webkit-scrollbar-track{background:var(--line2)}
.num{text-align:right!important;font-variant-numeric:tabular-nums}.neg{color:var(--bad-fg);font-weight:700}
.wt.ct tfoot th{position:sticky;bottom:0;background:var(--line2);border-top:1px solid var(--line);padding:6px 7px}
.wt td.memo{max-width:320px;min-width:200px;font-size:12px;color:var(--mute)}.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wt td.ckc{text-align:center;font-size:12px}.wt td.ckc.ok{color:var(--ok-fg);font-weight:700}.wt td.ckc.note{color:var(--warn-fg)}
.tag.b-계약{background:var(--accent-weak);color:var(--accent)}.tag.b-결제{background:var(--ok-bg);color:var(--ok-fg)}.tag.b-미수{background:var(--bad-bg);color:var(--bad-fg)}
.tag.ct-구매{background:var(--line2);color:var(--fg)}
.kpis{display:flex;gap:8px;flex-wrap:wrap}.kpi{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;display:grid;gap:2px;min-width:150px}
.kpi span{font-size:12px;color:var(--mute)}.kpi b{font-size:16px;font-variant-numeric:tabular-nums}.kpi small{font-size:11.5px;color:var(--mute)}.kpi.bad b{color:var(--bad-fg)}
.warnbox{background:var(--warn-bg);color:var(--warn-fg);border-radius:6px;padding:10px 12px;margin:0}
.donebox{background:var(--ok-bg);color:var(--ok-fg);border-radius:6px;padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.paysum{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.payadd{display:grid;grid-template-columns:140px 100px 1fr 120px 1fr auto;gap:6px;margin-top:8px}
.payadd input,.payadd select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--field);min-width:0}

.cplist{display:grid;gap:4px;max-height:60vh;overflow:auto}.cprow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line2);padding:2px 0}
.cprow span{display:flex;gap:4px}.sumbox{max-width:100%;overflow-x:auto}
@media (max-width:760px){.sumwrap{padding:12px 16px 0}.sumt{font-size:12px}.sumt th,.sumt td{padding:4px 6px;min-width:0}}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:6px;color:var(--mute);font-weight:500}
.nav button.on{background:var(--accent-weak);color:var(--accent);font-weight:700}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:40;padding:16px}
.loginbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(360px,100%);display:grid;gap:12px}
.loginbox h2{margin:0;font-size:18px}.loginbox .logo{height:40px;justify-self:start;background:#fff;border-radius:4px;padding:2px 4px}
.cards{display:grid;gap:10px;padding:16px 20px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.card .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.card .d{font-size:13px;color:var(--mute);display:flex;gap:6px 12px;flex-wrap:wrap}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 20px 0}
.toolbar select,.toolbar input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.badge{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;font-weight:700;background:var(--line2);color:var(--mute)}
.badge.install{background:var(--ok-bg);color:var(--ok-fg)}.badge.as{background:var(--bad-bg);color:var(--bad-fg)}
.badge.s-접수{background:var(--warn-bg);color:var(--warn-fg)}.badge.s-배정{background:var(--accent-weak);color:var(--accent)}.badge.s-보류{background:var(--line2);color:var(--fg);outline:1px dashed var(--mute)}.badge.s-완료{background:var(--ok-bg);color:var(--ok-fg)}.badge.s-취소{text-decoration:line-through}
.money{font-variant-numeric:tabular-nums}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:13px;cursor:pointer}
dialog{max-width:720px}
#cfm{max-width:340px;width:calc(100% - 48px)}#cfm .cfmb{padding:22px 22px 16px;display:grid;gap:18px}#cfm p{margin:0;font-size:16px;font-weight:600;text-align:center}#cfm .cfmf{display:flex;justify-content:center;gap:10px}#cfm .btn{min-width:90px}
.stafft{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel)}
.stafft td,.stafft th{padding:6px 6px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
.stafft input,.stafft select{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--field);width:100%;min-width:70px}
.wrapx{overflow-x:auto;padding:0 20px}
.pickres{display:grid;gap:4px;max-height:240px;overflow:auto}
.pickres button{text-align:left;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:7px 10px;display:grid;gap:2px}
.pickres button:hover,.pickres button:focus-visible{border-color:var(--accent);background:var(--accent-weak)}
.pickres small{color:var(--mute)}
.picked{border:1px solid var(--accent);background:var(--accent-weak);border-radius:6px;padding:8px 10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sec{padding:16px 20px;display:grid;gap:12px;max-width:900px}
@media (max-width:760px){.g3{grid-template-columns:1fr 1fr}.toolbar,.cards,.wrapx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
/* ================= A4 양식 ================= */
.sheet{width:210mm;min-height:297mm;padding:9mm 9mm 8mm;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111;font-size:9.6pt;line-height:1.25;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;display:flex;flex-direction:column}
.sheet .tophd{display:flex;justify-content:space-between;font-size:7.6pt;color:#555;border-bottom:.3mm solid #999;padding-bottom:1.2mm}
.sheet .ttl{text-align:center;font-family:"HY헤드라인M","HYHeadLine-Medium","Malgun Gothic",sans-serif;font-size:23pt;letter-spacing:2mm;margin:4mm 0 3mm;font-weight:500}
.sheet .intro{background:var(--f-peach);text-align:center;font-weight:700;font-size:8.8pt;padding:2.2mm 4mm;line-height:1.6}
.sheet table.ft{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:3.2mm;border:.45mm solid var(--f-line)}
.sheet table.ft td{border:.2mm solid #555;height:6.3mm;padding:.4mm 1.6mm;vertical-align:middle;overflow:hidden;word-break:keep-all}
.sheet td.sec{background:var(--f-blue);font-weight:700;text-align:center;line-height:1.5;white-space:pre-line;border-right:.45mm solid var(--f-line)}
.sheet td.lb{background:var(--f-blue);font-weight:700;text-align:center;white-space:nowrap}
.sheet td.hd{background:var(--f-blue);font-weight:700;text-align:center;letter-spacing:1.2mm}
.sheet td.v{font-weight:400}
.sheet td.c{text-align:center}
.sheet td.r{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.it{font-weight:700;font-size:9pt}
.sheet td.multi{white-space:pre-wrap;height:auto;min-height:6.3mm}
.sheet td.pay{font-weight:700;text-align:center;font-size:9.6pt;line-height:1.6;padding:1.4mm}
.sheet td.tot{font-weight:700}
.sheet .cb{display:inline-block;width:3.1mm;height:3.1mm;border:.25mm solid #222;vertical-align:-.45mm;margin-right:.8mm;position:relative;background:#fff}
.sheet .cb.on::after{content:"";position:absolute;left:.85mm;top:.05mm;width:1mm;height:2mm;border:solid #0b3d91;border-width:0 .55mm .55mm 0;transform:rotate(45deg)}
.sheet .cbs{display:flex;flex-wrap:wrap;gap:.6mm 3.2mm;justify-content:center;font-weight:700;font-size:9pt}
.sheet .stmt{display:flex;justify-content:space-between;margin:4.5mm 6mm 2mm;font-size:9.8pt}
.sheet .stmt .d{display:flex;gap:6mm;min-width:62mm;justify-content:flex-end}
.sheet .stmt .d span{display:inline-block;min-width:9mm;text-align:right}
.sheet .sign{display:grid;grid-template-columns:1fr 1fr;row-gap:2mm;margin:2mm 6mm 0;font-weight:700;font-size:10pt}
.sheet .sign > div{display:flex;align-items:flex-end;gap:2mm;min-height:9mm}
.sheet .sign .ln{flex:1;border-bottom:.2mm solid #777;padding:0 1mm .6mm;font-weight:400}
.sheet .sign .in{color:#333;font-weight:400}
.sheet .foot{margin-top:auto;border-top:.3mm solid #999;padding-top:3mm;display:grid;grid-template-columns:44mm 1fr 26mm;align-items:center;gap:4mm;font-size:8pt;color:#222;line-height:1.55}
.sheet .foot img.logo{width:40mm}
.sheet .foot img.seal{width:22mm;justify-self:end}
.sheet .blank{color:transparent}

#printRoot{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff;height:auto}
  .app,dialog,.toast{display:none!important}
  #printRoot{display:block}
  #printRoot .sheet{height:297mm;min-height:0;overflow:hidden;page-break-after:always;break-after:page}
  #printRoot .sheet:last-child{page-break-after:auto;break-after:auto}
}

.sheet{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#printRoot{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff}
  .app,dialog,.toast,.login{display:none!important}
  #printRoot{display:block}
  #printRoot .sheet{height:297mm;min-height:0;overflow:hidden}
}
</style>

function today(){const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function p2(n){return String(n).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function won(n){n=Number(String(n??"").replace(/[^\d-]/g,""));return n?n.toLocaleString("ko-KR"):""}
function num(v){return Number(String(v??"").replace(/[^\d-]/g,""))||0}
function kdate(s){if(!s)return"";const m=String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return m?`${m[1]}. ${+m[2]}. ${+m[3]}.`:s}
function ymd(s){const m=String(s||"").match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return m?[m[1],+m[2],+m[3]]:["","",""]}
function fmtPhone(v){
  let d=String(v??"").replace(/\D/g,"");
  if(/^1\d{8,9}$/.test(d))d="0"+d;               // 엑셀에서 앞자리 0이 빠진 경우
  if(d.startsWith("02")){if(d.length===9)return d.replace(/(02)(\d{3})(\d{4})/,"$1-$2-$3");if(d.length===10)return d.replace(/(02)(\d{4})(\d{4})/,"$1-$2-$3")}
  if(d.length===11)return d.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3");
  if(d.length===10)return d.replace(/(\d{3})(\d{3})(\d{4})/,"$1-$2-$3");
  if(d.length===8)return d.replace(/(\d{4})(\d{4})/,"$1-$2");
  return String(v??"").trim();
}
function fmtBiz(v){const d=String(v??"").replace(/\D/g,"");return d.length===10?d.replace(/(\d{3})(\d{2})(\d{5})/,"$1-$2-$3"):String(v??"").trim()}
function toDate(v){
  if(v==null||v==="")return"";
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())}
  const s=String(v).trim();let m=s.match(/^(\d{4})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})/);
  if(m)return m[1]+"-"+p2(m[2])+"-"+p2(m[3]);
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/);if(m)return "20"+m[1]+"-"+p2(m[2])+"-"+p2(m[3]);
  return s;
}

async function fetchAll(table,select="*"){

  for(let from=0;;from+=step){const {data,error}=await sb.from(table).select(select).range(from,from+step-1);if(error)throw error;out.push(...data);if(data.length<step)break}
  return out;
}

let reloadSeq=0;
async function reload(tables,quiet){
  const seq=++reloadSeq;let res;
  try{res=await Promise.all(tables.map(t=>TBL[t]()))}catch(e){if(!quiet)toast("최신 내용을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");return false}
  if(seq!==reloadSeq&&quiet)return false;
  let changed=false;
  tables.forEach((t,i)=>{const d=res[i];const old={customers,contracts,jobs,staff,payments,files,grades}[t];if(JSON.stringify(old)!==JSON.stringify(d))changed=true;
    if(t==="customers")customers=d;if(t==="contracts")contracts=d;if(t==="jobs")jobs=d;if(t==="staff")staff=d;if(t==="payments")payments=d;if(t==="files")files=d;if(t==="grades")grades=d});
  if(tables.includes("staff")&&me){const s=staff.find(x=>x.user_id===me.id);if(s){me.name=s.name;me.role=s.role;document.getElementById("modeLabel").textContent=`${me.name||me.email} · ${ROLE[me.role]}`}}
  if(ui.sel&&!custById(ui.sel))ui.sel=null;
  buildIdx();if(!quiet||changed)render();return true;
}

/* 사진을 글자 읽기 좋게: 긴 변 2000px 안팎, 흑백 */
async function prepImage(src,mode){
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});

  const x=c.getContext("2d");x.imageSmoothingQuality="high";x.filter="grayscale(1) contrast(1.15)";x.drawImage(img,0,0,c.width,c.height);
  if(mode==="bin"){ // 흑백 이진화(오츠): 바탕 무늬·워터마크 제거
    const d=x.getImageData(0,0,c.width,c.height),p=d.data,h=new Array(256).fill(0);for(let i=0;i<p.length;i+=4)h[p[i]]++;
    const tot=c.width*c.height;let sum=0;for(let i=0;i<256;i++)sum+=i*h[i];let sB=0,wB=0,best=0,th=128;
    for(let i=0;i<256;i++){wB+=h[i];if(!wB)continue;const wF=tot-wB;if(!wF)break;sB+=i*h[i];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=i}}
    for(let i=0;i<p.length;i+=4){const v=p[i]>th?255:0;p[i]=p[i+1]=p[i+2]=v}x.putImageData(d,0,0)}
  return c;
}
let _tw=null;

/* 파일 → 글자. PDF는 글자층을 먼저 쓰고, 없으면(스캔 PDF) 첫 장을 그림으로 읽음 */
async function readBizText(file,prog){

    prog("PDF 여는 중…");const lib=await pdfLib();const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;const pg=await doc.getPage(1);
    const tc=await pg.getTextContent();const rows={};tc.items.forEach(it=>{const y=Math.round(it.transform[5]/4);(rows[y]=rows[y]||[]).push(it)});
    const txt=Object.keys(rows).map(Number).sort((a,b)=>b-a).map(y=>{const it=rows[y].sort((a,b)=>a.transform[4]-b.transform[4]);let s="",end=null;
      it.forEach(i=>{const x=i.transform[4],fs=Math.abs(i.transform[0])||10;if(end!==null&&x-end>fs*0.2&&!/\s$/.test(s)&&!/^\s/.test(i.str))s+=" ";s+=i.str;end=x+(i.width||0)});return s}).join("\n");
    if(txt.replace(/\s/g,"").length>30)return{text:txt,how:"pdf"};
    const vp=pg.getViewport({scale:2.2});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    return{text:await ocrCanvas(cv,prog),how:"ocr"};
  }

    if(Object.keys(f1).length>=6)return{text:t1,how:"ocr",fields:f1};

    const m=Object.assign({},f2,f1);return{text:t1+"\n\n----- 흑백으로 다시 읽은 글자 -----\n"+t2,how:"ocr",fields:m}}

}
/* 글자에서 항목 뽑기 (글자 사이 띄어쓰기·OCR 잡음 허용) */

/* 큰 사진은 보관 전에 줄임 (긴 변 2400px, JPEG) */
async function shrinkForStore(file){
  if(!/^image\//.test(file.type)||file.size<1500000||/heic/i.test(file.type))return file;
  const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const k=Math.min(1,2400/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const b=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.85));return b?new File([b],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file}catch(e){return file}finally{URL.revokeObjectURL(url)}
}
async function storeBizDoc(custId,file){

let payIdx={};
function buildPayIdx(){payIdx={};payments.forEach(p=>(payIdx[p.contract_id]=payIdx[p.contract_id]||[]).push(p));Object.values(payIdx).forEach(a=>a.sort((x,y)=>(x.pay_date||"").localeCompare(y.pay_date||"")))}
function paysOf(k){return payIdx[k.id]||[]}
function payStat(k){const ps=paysOf(k);let card=0,other=0,last="";ps.forEach(p=>{const a=Number(p.amount||0);if(p.method==="카드")card+=a;else other+=a;if(p.pay_date&&p.pay_date>last)last=p.pay_date});
  const paid=card+other;return{card,other,paid,last,unpaid:Number(k.amount||0)-paid,n:ps.length}}
function monthRange(ym){const [y,m]=ym.split("-").map(Number);return[ym+"-01",(m===12?(y+1)+"-01":y+"-"+String(m+1).padStart(2,"0"))+"-01"]}
const CROWS=[["done","설치완료",k=>k.stage==="완료"],["open","미완료",k=>k.stage==="미정"||k.stage==="확정"],["hold","보류",k=>k.stage==="보류"],["cancel","취소",k=>k.stage==="취소"],["unpaid","미수",k=>k.stage==="미수"],["remove","철거",k=>k.stage==="철거"]];
function installOf(k){const j=jobs.filter(x=>x.kind==="install"&&(x.contract_id===k.id||(!x.contract_id&&x.customer_id===k.customer_id))&&x.status!=="취소")[0];return j||null}

 ["cdate","계약일자",1],["idate","설치일자",1],["channel","영업 경로",0],["referrer","소개",0],["s1","1차",0],["s2","2차",0],["s3","3차(담당)",1],["doc","계약서",0],["tech","설치기사",0],
 ["product","제품",1],["size","사이즈",1],["serial","시리얼",1],["wash","수압식",0],["sink","싱크준비",1],["parts","부자재",0],["amount","합계금액",1],["card","카드",1],["cash","현금+캐피탈",1],["paid","입금합계",0],["unpaid","미수금",1],["last","최종결제일",1],
 ["approval","승인처",1],["tax","계산서 발급",0],["chk_cust","고객등록",1],["chk_slip","전표마감",1],["chk_sales","매출마감",1],["memo","비고",1]];

/* 표 열 설정(넣고 빼기·순서·너비) — 계약관리(ctr)·작업현황(work) 공용, 브라우저별로 기억 */
const TCFG={ctr:{cols:()=>CCOLS,sel:".wt.ct",lead:()=>1},work:{cols:()=>WCOLS,sel:".wt.wk",lead:()=>isAdmin()?2:1}};
function colKey(t="ctr"){return "hc.cols."+t+"."+(me&&me.id||"")}
function getCols(t="ctr"){const C=TCFG[t].cols();let v=null;try{v=JSON.parse(localStorage.getItem(colKey(t))||"null")}catch(e){}
  const all=C.map(c=>c[0]);if(Array.isArray(v))v={cols:v,seen:all.filter(x=>!["sink","parts"].includes(x))};
  if(!v||!Array.isArray(v.cols))return C.filter(c=>c[2]).map(c=>c[0]);
  const cols=v.cols.filter(x=>all.includes(x));const seen=v.seen||all;
  C.forEach(([k,,d],i)=>{if(d&&!seen.includes(k)&&!cols.includes(k)){const prev=C.slice(0,i).map(c=>c[0]).reverse().find(x=>cols.includes(x));cols.splice(prev?cols.indexOf(prev)+1:cols.length,0,k)}});
  return cols}
function setCols(v,t="ctr"){try{localStorage.setItem(colKey(t),JSON.stringify({cols:v,seen:TCFG[t].cols().map(c=>c[0])}))}catch(e){}}
function cwKey(t="ctr"){return "hc.colw."+t+"."+(me&&me.id||"")}
function getColW(t="ctr"){try{return JSON.parse(localStorage.getItem(cwKey(t))||"{}")||{}}catch(e){return{}}}
function setColW(o,t="ctr"){try{localStorage.setItem(cwKey(t),JSON.stringify(o))}catch(e){}}
function applyColW(cols,live,t="ctr"){const w=Object.assign(getColW(t),live||{});const id="colwStyle_"+t;let st=document.getElementById(id);if(!st){st=document.createElement("style");st.id=id;document.head.appendChild(st)}
  const sel=TCFG[t].sel,lead=TCFG[t].lead();
  st.textContent=cols.map((c,i)=>w[c]?`${sel} tr>*:nth-child(${i+lead+1}){width:${w[c]}px;min-width:${w[c]}px;max-width:${w[c]}px;overflow:hidden;text-overflow:ellipsis}`:"").join("\n")}
function bindColResize(cols,t="ctr"){
  view().querySelectorAll(TCFG[t].sel+" .rz").forEach(h=>{
    h.onclick=e=>e.stopPropagation();
    h.ondblclick=e=>{e.stopPropagation();const w=getColW(t);delete w[h.dataset.rz];setColW(w,t);applyColW(cols,null,t)};
    h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();const th=h.parentElement,k=h.dataset.rz,x0=e.clientX,w0=th.getBoundingClientRect().width;let w=w0;
      h.setPointerCapture(e.pointerId);document.body.classList.add("resizing");
      h.onpointermove=ev=>{w=Math.max(36,Math.round(w0+ev.clientX-x0));applyColW(cols,{[k]:w},t)};
      h.onpointerup=()=>{h.onpointermove=null;h.onpointerup=null;document.body.classList.remove("resizing");const o=getColW(t);o[k]=w;setColW(o,t);applyColW(cols,null,t)}};
  });
}
function colHead(cols,t,numCols){const lab=Object.fromEntries(TCFG[t].cols().map(c=>[c[0],c[1]]));
  return cols.map(c=>`<th class="${numCols&&numCols.has(c)?"num":""}" data-ck="${c}">${esc(lab[c])}<span class="rz" data-rz="${c}" title="끌어서 너비 조절 · 두 번 클릭하면 원래대로"></span></th>`).join("")}
function colPicker(onDone,t="ctr"){

  const draw=()=>{const order=[...cur,...C.map(c=>c[0]).filter(x=>!cur.includes(x))];
    document.getElementById("cpList").innerHTML=order.map(k=>{const on=cur.includes(k);const i=cur.indexOf(k);return `<div class="cprow"><label class="chip"><input type="checkbox" data-ck="${k}" ${on?"checked":""}>${esc(lab[k])}</label>
      ${on?`<span><button type="button" class="btn sm" data-up="${k}" ${i===0?"disabled":""} aria-label="${esc(lab[k])} 위로">↑</button><button type="button" class="btn sm" data-dn="${k}" ${i===cur.length-1?"disabled":""} aria-label="${esc(lab[k])} 아래로">↓</button></span>`:""}</div>`}).join("");
    document.querySelectorAll("#cpList [data-ck]").forEach(x=>x.onchange=()=>{const k=x.dataset.ck;cur=x.checked?[...cur,k]:cur.filter(y=>y!==k);draw()});
    document.querySelectorAll("#cpList [data-up],#cpList [data-dn]").forEach(b=>b.onclick=()=>{const k=b.dataset.up||b.dataset.dn;const i=cur.indexOf(k),j=b.dataset.up?i-1:i+1;if(j<0||j>=cur.length)return;[cur[i],cur[j]]=[cur[j],cur[i]];draw()})};

    [["열 너비 초기화","",()=>{setColW({},t);applyColW(getCols(t),null,t);toast("열 너비를 원래대로 돌렸습니다");return true}],["기본값으로","",()=>{cur=C.filter(c=>c[2]).map(c=>c[0]);draw();return true}],["취소"],["적용","pri",()=>{if(!cur.length){toast("열을 하나 이상 고르세요");return true}setCols(cur,t);onDone()}]]);

function ctrCell(col,k,c,st,basis){
  const ij=installOf(k);
  switch(col){
    case"basis":{const d=baseDate(k);const ij2=installOf(k);return `<td title="${esc((ij2&&(ij2.done_date||ij2.visit_date)?"설치일 기준":"설치일 없음 → 계약일 기준")+" · "+basis.join("·"))}">${esc(d?d.slice(2,4)+d.slice(5,7):"")}</td>`}
    case"ctype":return `<td><span class="tag ct-${esc(k.contract_type||"구매")}">${esc(k.contract_type||"구매")}</span></td>`;
    case"stage":return `<td><span class="tag st-${esc(k.stage)}">${esc(k.stage)}</span></td>`;
    case"trial":return `<td>${trialCell(k)}</td>`;
    case"name":return `<td title="${esc(c.name||"")}"><b>${esc(c.name||"")}</b>${gradeBadge(c)}</td>`;
    case"ceo":return `<td>${esc(c.ceo||"")}</td>`;
    case"phone":return `<td>${esc(c.phone||c.phone2||"")}</td>`;
    case"addr":return `<td class="wrap">${esc(c.address||"")}</td>`;
    case"cdate":return `<td>${esc(ymd2(k.contract_date))}</td>`;
    case"idate":return `<td>${esc(ij?ymd2(ij.done_date||ij.visit_date):"")}</td>`;
    case"channel":return `<td>${esc(k.channel||"")}</td>`;
    case"referrer":return `<td>${esc(k.referrer||"")}</td>`;
    case"s1":return `<td>${esc(k.sales1||"")}</td>`;
    case"s2":return `<td>${esc(k.sales2||"")}</td>`;
    case"s3":return `<td>${esc(s3Text(k)||"")}</td>`;
    case"doc":return `<td>${esc(k.contract_doc||"")}</td>`;
    case"tech":return `<td>${esc(ij?whoOf(ij):"")}</td>`;
    case"product":return `<td>${esc(k.product||"")}</td>`;
    case"size":return `<td>${esc([k.size,k.options].filter(Boolean).join(" "))}</td>`;
    case"serial":return `<td>${esc(k.serial||"")}</td>`;
    case"wash":return `<td>${k.wash_added?"수압식":""}</td>`;
    case"sink":return `<td>${ij?sinkCell(ij):""}</td>`;
    case"parts":return `<td>${esc(ij&&ij.parts||"")}</td>`;
    case"amount":return `<td class="num">${won0(k.amount)}</td>`;
    case"card":return `<td class="num">${st.card?won0(st.card):""}</td>`;
    case"cash":return `<td class="num">${st.other?won0(st.other):""}</td>`;
    case"paid":return `<td class="num">${st.paid?won0(st.paid):""}</td>`;
    case"unpaid":return `<td class="num ${st.unpaid>0&&k.stage!=="취소"?"neg":""}">${st.n||k.stage==="미수"?won0(st.unpaid):""}</td>`;
    case"last":return `<td>${esc(ymd2(st.last))}</td>`;
    case"approval":return `<td>${esc(k.approval||k.pay_method||"")}</td>`;
    case"tax":{const t=k.tax||{};return `<td>${esc(t.date?ymd2(t.date):t.type||"")}</td>`}
    case"chk_cust":case"chk_slip":case"chk_sales":{const v=k[col]||"";return `<td class="ckc ${v==="OK"?"ok":v?"note":""}" data-chk="${col}" data-kid="${k.id}" title="${isOffice()?"누르면 OK ↔ 빈칸":""}">${esc(v)}</td>`}
    case"memo":return `<td class="wrap memo" title="${esc(k.memo||"")}"><div class="clamp">${esc(k.memo||"")}</div></td>`;
  }
  return "<td></td>";
}

function parseSheet(rows,hr){
  const H=rows[hr].map(h=>String(h||"").trim());
  const ix=(n,k=0)=>{let c=-1;for(let i=0;i<H.length;i++)if(H[i]===n&&++c===k)return i;return -1};
  if(ix("고객등록")<0){const b=ix("합계금액",2);if(b>=0&&!H[b+1]&&!H[b+2]&&!H[b+3]){H[b+1]="고객등록";H[b+2]="전표마감";H[b+3]="매출마감"}}
  const has=(n,k=0)=>ix(n,k)>=0;
  const out=[];
  rows.slice(hr+1).forEach(row=>{
    if(!row.some(v=>String(v).trim()!==""))return;
    const g=(n,k=0)=>{const i=ix(n,k);return i<0?"":row[i]};const t=(n,k=0)=>{const v=g(n,k);return v instanceof Date?toDate(v):String(v??"").trim()};
    if(!t("업체명"))return;
    const raw={};H.forEach((h,i)=>{if(!h)return;let key=h,n=2;while(key in raw)key=h+"#"+(n++);const v=row[i];raw[key]=v instanceof Date?toDate(v):v});
    out.push({t,g,raw,has});
  });
  return out;
}
function money(v){if(v==null)return 0;if(typeof v==="number")return Math.round(v);const s=String(v).replace(/[^\d-]/g,"");return s&&s!=="-"?Number(s):0}
function custKey(c){const d=String(c.biz_no||"").replace(/\D/g,"");return d.length===10?"b:"+d:"n:"+nk(c.name)+"|"+String(c.phone||c.phone2||"").replace(/\D/g,"")}
function planImport(rows,fresh){
  const exCust=fresh?[]:customers,exCtr=fresh?[]:contracts;
  const byKey={};exCust.forEach(c=>byKey[custKey(c)]=c);
  const byName={};exCust.forEach(c=>{const n=nk(c.name);(byName[n]=byName[n]||[]).push(c)});
  const digits=s=>String(s||"").replace(/\D/g,"");
  const serials=new Set(exCtr.map(k=>nk(k.serial)).filter(Boolean));
  const sig=new Set(exCtr.map(k=>k.customer_id+"|"+nk(k.product)+"|"+(k.contract_date||"")+"|"+k.amount));
  const bySerial={},bySig={};exCtr.forEach(k=>{if(k.serial)bySerial[nk(k.serial)]=k;bySig[k.customer_id+"|"+nk(k.product)+"|"+(k.contract_date||"")+"|"+k.amount]=k});
  const newCust=[],newCtr=[],newJob=[],newPay=[],updCtr=[];let skipped=0,payWarn=0;const td=today();const withPay=!ui.noPay;
  rows.forEach(({t,g,raw,has})=>{
    let name=t("업체명");const notes=[];
    const ft=name.match(/\s*\(([^)]*체험[^)]*)\)\s*$/);let trial="";if(ft){trial=ft[1].replace(/무료체험\s*/,"").trim()||"예";name=name.replace(ft[0],"").trim()}
    const om=name.match(/\s*\(([^)]*(오픈|예정)[^)]*)\)\s*$/);if(om){notes.push(om[1]);name=name.replace(om[0],"").trim()}
    let bizRaw=t("사업자등록번호"),bd=bizRaw.replace(/\D/g,"");let biz="";
    if(/^(없음|-|x|해당없음)?$/i.test(bizRaw))biz="";else if(bd.length>=9){if(bd.length===9)bd="0"+bd;biz=fmtBiz(bd)}else notes.push("사업자번호칸: "+bizRaw);
    let phone=fmtPhone(t("휴대번호")),phone2=fmtPhone(t("일반전화"));if(!phone&&phone2){phone=phone2;phone2=""}if(phone2===phone)phone2="";
    const s3=t("3차");const s3clean=["무료체험","보상판매"].includes(s3)?"":s3;
    const cu={id:crypto.randomUUID(),name,ceo:t("대표자"),phone,phone2,biz_no:biz,address:t("상점주소"),owner_name:s3clean,memo:""};
    const key=custKey(cu);let cust=byKey[key];
    if(!cust){const cand=(byName[nk(name)]||[]).filter(x=>(!x.biz_no||!biz||x.biz_no===biz)&&(!digits(x.phone)||!digits(phone)||digits(x.phone)===digits(phone)));
      if(cand.length===1&&(!biz||!phone||!cand[0].biz_no||!digits(cand[0].phone)))cust=cand[0]}
    if(!cust){cust=cu;byKey[key]=cu;(byName[nk(name)]=byName[nk(name)]||[]).push(cu);newCust.push(cu)}
    // 계약
    const stRaw=t("진행단계");let stage=STAGES.includes(stRaw)?stRaw:"확정";
    const g0=t("구분",0);const typeRaw=CTYPES.includes(g0)?g0:"";
    const channel=has&&has("영업경로")?t("영업경로"):has&&has("영업 경로")?t("영업 경로"):has&&has("구분",1)?t("구분",1):(typeRaw?"":g0);
    const ctype=CTYPES.includes(typeRaw)?typeRaw:CTYPES.includes(stRaw)?stRaw:"구매";if(stRaw&&!STAGES.includes(stRaw)&&!CTYPES.includes(stRaw))notes.push("진행단계: "+stRaw);
    const s2=t("2차");if(s2==="무료체험"&&!trial)trial="예";
    let size=t("사이즈"),opts=[];if(/수압식/.test(size))size="";else{const z=size.match(/^(\d+(?:\s*[*xX×]\s*\d+)?)\s*(무|좌)?/);if(z){size=z[1].replace(/\s/g,"");if(z[2]==="무")opts.push("무턱");if(z[2]==="좌")opts.push("좌배수")}}
    const p1=g("부자재",0),p2=g("부자재",1);const partsText=typeof p1==="string"&&!/^[\d,\s-]*$/.test(p1)?p1.trim():"";
    const amtParts=partsText?money(p2):money(p1);
    const ap=t("승인처");const monthly=money(g("월할부금"));
    let pay="";if(/CMS/i.test(stRaw))pay="CMS";else if(/캐피탈|하나/.test(ap)||monthly)pay="캐피탈";else if(/\+\s*현금/.test(ap))pay="카드+현금";else if(ap==="현금")pay="현금";else if(ap)pay="카드";
    const doc=t("계약서");const iss=g("발급일");
    const tax=iss instanceof Date?{type:"세금계산서",date:toDate(iss),supply:money(g("공급가액")),vat:money(g("부가세")),total:money(g("합계금액",2))}:(String(iss||"").trim()?{type:String(iss).trim()}:{});
    const sm=t("정산년월").match(/(\d{2,4})\s*년\s*(\d{1,2})\s*월/);
    const memo=[t("비고"),...notes].filter(Boolean).join(" / ");
    const k={id:crypto.randomUUID(),customer_id:cust.id,contract_date:toDate(g("계약일자"))||null,stage,contract_type:ctype,channel,referrer:t("소개"),sales1:t("1차"),sales2:["무료체험","보상판매"].includes(s2)?"":s2,sales3_name:s3clean,free_trial:trial,
      product:t("제품")==="수압식"?"수압식":t("제품"),size,options:opts.join(", "),serial:t("시리얼"),wash_added:!!t("수압식")||t("제품")==="수압식",
      amt_ultra:money(g("초음파")),amt_wash:money(g("워시")),amt_parts:amtParts,amount:money(g("합계금액",0)),pay_method:pay,contract_doc:doc==="○"?"사진":doc==="●"?"원본":"미수령",
      capital:(pay==="캐피탈"?{company:ap,approver:t("승인자"),monthly,interest:money(g("이자")),months:money(g("기간")),total:money(g("합계"))}:{}),
      cms:pay==="CMS"?{day:((stRaw.match(/(\d+)\s*일/)||[])[1]||"")}:{},tax,settle_month:sm?`${sm[1].length===2?"20"+sm[1]:sm[1]}-${sm[2].padStart(2,"0")}`:"",memo,import_raw:raw};
    if(!k.amount)k.amount=k.amt_ultra+k.amt_wash+k.amt_parts;
    const extra={approval:ap,chk_cust:t("고객등록"),chk_slip:t("전표마감"),chk_sales:t("매출마감")};
    if(withPay)Object.assign(k,extra);
    // 입금 (엑셀의 입금일자 묶음 3개 → 입금 내역)
    const pays=[];
    if(withPay){
      const pd=v=>{if(v instanceof Date)return{d:toDate(v),m:""};const s_=String(v||"").trim();if(!s_)return{d:null,m:""};const all=[...s_.matchAll(/(\d{2,4})[./-](\d{1,2})[./-](\d{1,2})/g)];
        if(!all.length)return{d:null,m:s_};const z=all[all.length-1];const y=z[1].length===2?"20"+z[1]:z[1];return{d:`${y}-${z[2].padStart(2,"0")}-${z[3].padStart(2,"0")}`,m:all.length>1?"입금일: "+s_.replace(/\s+/g,", "):""}};
      const blocks=[{d:g("입금일자",0),co:"",items:[["카드",g("신용카드",0)],["캐피탈",g("캐피탈",0)],["현금",g("현금",0)]]},
        {d:g("입금일자",1),co:t("카드사",0),items:[["카드",g("신용카드",1)],["승인취소",g("승인취소",0)],["캐피탈",g("캐피탈",1)],["현금",g("현금",1)]]},
        {d:g("입금일자",2),co:"",items:[["카드",g("신용카드",2)],["캐피탈",g("캐피탈",2)],["현금",g("현금",2)]]}];
      blocks.forEach(b=>{const dd=pd(b.d);b.items.forEach(([m,v])=>{const a=money(v);if(!a)return;
        pays.push({id:crypto.randomUUID(),contract_id:null,customer_id:null,pay_date:dd.d,method:m==="승인취소"?"승인취소":m,payer:m==="카드"?(b.co||(/카드|페이|네이버/.test(ap)?ap.replace(/\+?\s*현금/,""):"")):"",amount:m==="승인취소"&&a>0?-a:a,memo:["엑셀 이관",dd.m].filter(Boolean).join(" · ")})})});
      const tot=money(g("합계금액",1));if(tot&&pays.reduce((a,p)=>a+p.amount,0)!==tot)payWarn++;
    }
    const sg=k.customer_id+"|"+nk(k.product)+"|"+(k.contract_date||"")+"|"+k.amount;
    const ex=(k.serial&&bySerial[nk(k.serial)])||bySig[sg];
    if((k.serial&&serials.has(nk(k.serial)))||sig.has(sg)){skipped++;
      if(ex&&withPay){updCtr.push({id:ex.id,patch:Object.assign({contract_type:ctype,channel,stage},extra,k.tax&&Object.keys(k.tax).length?{tax:k.tax}:{}),pays:paysOf(ex).length?[]:pays.map(p=>Object.assign(p,{contract_id:ex.id,customer_id:ex.customer_id}))})}
      return}
    if(k.serial)serials.add(nk(k.serial));sig.add(sg);newCtr.push(k);
    pays.forEach(p=>{p.contract_id=k.id;p.customer_id=k.customer_id;newPay.push(p)});
    // 설치 작업
    const vd=toDate(g("설치일자"))||null;const tn=t("설치1");
    let status=stage==="취소"?"취소":(vd&&vd<=td?"완료":(vd||tn?"배정":"접수"));
    const sinkRaw=t("싱크준비")||t("싱크발주");
    newJob.push({id:crypto.randomUUID(),kind:"install",customer_id:cust.id,contract_id:k.id,customer_name:cust.name,address:cust.address,product:productOf(k),status,request_date:k.contract_date||vd||td,visit_date:vd,visit_time:t("시간"),
      techs:[],tech_names:tn,symptom:"",result:"",cost:0,sink_status:SINKS.includes(sinkRaw)?sinkRaw:(sinkRaw?"기타":""),sink_memo:SINKS.includes(sinkRaw)?"":sinkRaw,parts:partsText,done_date:status==="완료"?vd:null});
  });
  return{newCust,newCtr,newJob,newPay,updCtr,skipped,payWarn};
}
async function runImport(plan,replace){
  try{
    if(replace){for(const tb of ["jobs","contracts","customers"]){const {error}=await sb.from(tb).delete().not("id","is",null);if(error)throw error}}
    const put=async(tb,rows)=>{for(let i=0;i<rows.length;i+=300){toast(`이관 중… ${{customers:"고객",contracts:"계약",jobs:"작업",payments:"입금"}[tb]} ${Math.min(i+300,rows.length)}/${rows.length}`);const {error}=await sb.from(tb).insert(rows.slice(i,i+300));if(error)throw error}};
    await put("customers",plan.newCust);await put("contracts",plan.newCtr);await put("jobs",plan.newJob);
    const ups=plan.updCtr||[];for(let i=0;i<ups.length;i++){if(i%10===0)toast(`기존 계약 갱신 중… ${i+1}/${ups.length}`);const {error}=await sb.from("contracts").update(ups[i].patch).eq("id",ups[i].id);if(error)throw error}
    await put("payments",[...(plan.newPay||[]),...ups.flatMap(u=>u.pays)]);
    if(!ui.noPay){const touched=new Set(ups.map(u=>u.id));const bad=contracts.filter(k=>!touched.has(k.id)&&CTYPES.includes(k.channel||""));
      for(const k of bad){const {error}=await sb.from("contracts").update({channel:"",contract_type:(k.contract_type&&k.contract_type!=="구매")?k.contract_type:k.channel}).eq("id",k.id);if(error)throw error}}
    await sb.rpc("link_staff_names");
    toast(`이관 완료: 고객 ${plan.newCust.length} · 계약 ${plan.newCtr.length} · 작업 ${plan.newJob.length} · 입금 ${(plan.newPay||[]).length+(plan.updCtr||[]).reduce((a,u)=>a+u.pays.length,0)} · 갱신 ${(plan.updCtr||[]).length}`);
    ui.sel=null;await loadAll();
  }catch(e){toast("이관 중 멈췄습니다: "+(e.message||""));await loadAll()}
}

/* ================= 공통 ================= */
/* 화면 가운데 확인창 */
function askConfirm(msg){const d=document.getElementById("cfm");document.getElementById("cfmMsg").textContent=msg;
  return new Promise(ok=>{let done=false;const fin=v=>{if(done)return;done=true;d.close();ok(v)};
    document.getElementById("cfmYes").onclick=()=>fin(true);document.getElementById("cfmNo").onclick=()=>fin(false);
    d.oncancel=e=>{e.preventDefault();fin(false)};d.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();e.stopPropagation();fin(true)}};
    d.showModal();setTimeout(()=>document.getElementById("cfmYes").focus(),0)})}
/* 입력 중 Enter: 창이 닫히지 않게 막고, "저장하시겠습니까?"를 물은 뒤 저장 */
document.getElementById("dlgForm").addEventListener("submit",e=>e.preventDefault());
document.getElementById("dlg").addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing||e.defaultPrevented)return;const el=e.target;
  if(!el.matches||!el.matches("input,select")||["checkbox","radio","file","button","submit"].includes(el.type))return;
  e.preventDefault();
  if(el.closest(".payadd")){const b=document.getElementById("pAdd");if(b)askConfirm("입금을 추가하시겠습니까?").then(y=>{if(y)b.click()});return}
  const btn=[...document.querySelectorAll("#dlgF .btn.pri")].pop();if(!btn)return;
  askConfirm(btn.textContent.trim()+"하시겠습니까?").then(y=>{if(y)btn.click();else el.focus()});
});
/* 고객정보 화면에서도 Enter는 확인 후 저장 */
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing||e.defaultPrevented)return;const el=e.target;const f=el.closest&&el.closest("#cf");
  if(!f||!el.matches("input,select")||["checkbox","radio","file"].includes(el.type))return;
  e.preventDefault();askConfirm("저장하시겠습니까?").then(y=>{if(y)f.requestSubmit();else el.focus()});
});
/* 싱크준비: 상태만 보이고, 메모가 있으면 마우스를 올렸을 때 메모 상자 */
function sinkCell(j){const s=esc(j.sink_status||""),m=String(j.sink_memo||"").trim();
  return m?`<span class="hastip" data-tip="${esc(m)}" tabindex="0">${s||"메모"}</span>`:s}
(function(){const box=document.createElement("div");box.id="tipbox";box.setAttribute("role","tooltip");box.hidden=true;document.body.appendChild(box);
  const show=el=>{box.textContent=el.dataset.tip;box.hidden=false;const r=el.getBoundingClientRect();const w=box.offsetWidth,h=box.offsetHeight;
    let x=r.left,y=r.bottom+6;if(x+w>innerWidth-8)x=innerWidth-8-w;if(y+h>innerHeight-8)y=r.top-h-6;box.style.left=Math.max(8,x)+"px";box.style.top=Math.max(8,y)+"px"};
  const hide=()=>{box.hidden=true};
  document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)show(el)});
  document.addEventListener("mouseout",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el&&!el.contains(e.relatedTarget))hide()});
  document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)show(el)});
  document.addEventListener("focusout",hide);document.addEventListener("scroll",hide,true);})();
/* 넓은 표: 화면 맨 아래에 붙는 가로 막대 (표의 가로 스크롤과 함께 움직임) */
function hbar(box){
  if(!box||box.nextElementSibling&&box.nextElementSibling.classList.contains("hbar"))return;
  const bar=document.createElement("div");bar.className="hbar";bar.setAttribute("aria-hidden","true");bar.innerHTML="<div></div>";box.after(bar);
  const sync=()=>{bar.firstChild.style.width=box.scrollWidth+"px";bar.hidden=box.scrollWidth<=box.clientWidth+1;if(Math.abs(bar.scrollLeft-box.scrollLeft)>1)bar.scrollLeft=box.scrollLeft};
  box.classList.add("hb");
  bar.addEventListener("scroll",()=>{if(Math.abs(box.scrollLeft-bar.scrollLeft)>1)box.scrollLeft=bar.scrollLeft});
  box.addEventListener("wheel",e=>{const dx=e.shiftKey&&!e.deltaX?e.deltaY:e.deltaX;if(!dx||box.scrollWidth<=box.clientWidth)return;
    const before=box.scrollLeft;box.scrollLeft+=dx;if(box.scrollLeft!==before){bar.scrollLeft=box.scrollLeft;e.preventDefault()}},{passive:false});
  box.addEventListener("scroll",()=>{if(Math.abs(bar.scrollLeft-box.scrollLeft)>1)bar.scrollLeft=box.scrollLeft});
  sync();if(window.ResizeObserver){const ro=new ResizeObserver(sync);ro.observe(box);const t=box.querySelector("table");if(t)ro.observe(t)}
}
function fdata(id){const root=document.getElementById(id);const els=[...root.querySelectorAll("[name]")];
  const one=n=>{const e=els.filter(x=>x.name===n);if(!e.length)return null;const x=e[0];if(x.type==="radio"){const r=e.find(y=>y.checked);return r?r.value:null}if(x.type==="checkbox")return x.checked?(x.value||"on"):null;return x.value};
  return{get:one,getAll:n=>els.filter(x=>x.name===n&&x.type==="checkbox"&&x.checked).map(x=>x.value)}}
function val(id){const el=document.getElementById(id);return el?el.value:""}
function openDlg(h,b,btns){
  const d=document.getElementById("dlg");document.getElementById("dlgH").innerHTML=h;document.getElementById("dlgB").innerHTML=b;
  const f=document.getElementById("dlgF");f.innerHTML="";
  btns.forEach(([t,cls,fn])=>{const x=document.createElement("button");x.className="btn "+(cls||"");x.textContent=t;x.onclick=async ev=>{ev.preventDefault();if(fn){const keep=await fn();if(keep===true)return}d.close()};f.appendChild(x)});
  if(!d.open)d.showModal();
}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3000);return true}
