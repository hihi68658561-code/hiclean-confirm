<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하이클린 업무관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 좌측 고객목록 | 우측 작업영역(입력 + A4 미리보기). 확인서는 PDF로 저장해 인쇄 */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --field:#ffffff; --line:#d8dee6; --line2:#e8ecf1;
  --fg:#1b2430; --mute:#5d6878; --accent:#1d5fa8; --accent-weak:#e5eef9; --on-accent:#ffffff;
  --danger:#b4232c; --warn-bg:#fff5dc; --warn-fg:#6b4a00; --ok-bg:#e4f3ea; --ok-fg:#1f6b45; --bad-bg:#fdeaea; --bad-fg:#a3262d;
  --pv:#e1e6ed;
  --font:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-blue:#c5d9f1; --f-peach:#fce4d6; --f-line:#3a3a3a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --field:#121821; --line:#2c3542; --line2:#232b36;
  --fg:#e6ebf2; --mute:#9aa6b5; --accent:#6ea8ec; --accent-weak:#1c2c42; --on-accent:#0b1522;
  --danger:#f08a8f; --warn-bg:#3a2f12; --warn-fg:#f2d48a; --ok-bg:#16352a; --ok-fg:#8fd6b0; --bad-bg:#3d1c20; --bad-fg:#f3a3a8;
  --pv:#0d1117; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --field:#121821; --line:#2c3542; --line2:#232b36;
  --fg:#e6ebf2; --mute:#9aa6b5; --accent:#6ea8ec; --accent-weak:#1c2c42; --on-accent:#0b1522;
  --danger:#f08a8f; --warn-bg:#3a2f12; --warn-fg:#f2d48a; --ok-bg:#16352a; --ok-fg:#8fd6b0; --bad-bg:#3d1c20; --bad-fg:#f3a3a8;
  --pv:#0d1117; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;min-height:100vh}
header.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top h1{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px}
header.top h1 .logo{height:26px;background:#fff;border-radius:4px;padding:1px 3px}
header.top .sp{flex:1}
.mode{font-size:12px;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.body{display:grid;grid-template-columns:300px minmax(0,1fr);flex:1;min-height:0}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 56px);position:sticky;top:0}
.search{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line2)}
.search input,.search select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.search .row{display:flex;gap:6px;align-items:center;justify-content:space-between;color:var(--mute);font-size:12.5px}
.clist{overflow:auto;flex:1}
.citem{padding:10px 12px;border-bottom:1px solid var(--line2);cursor:pointer;display:grid;gap:3px}
.citem:hover{background:var(--accent-weak)}
.citem.sel{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.citem .n{font-weight:700}
.citem .s{font-size:12.5px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--line2);color:var(--mute)}
.tag.st-미수{background:var(--bad-bg);color:var(--bad-fg)}.tag.st-보류,.tag.st-미정{background:var(--warn-bg);color:var(--warn-fg)}.tag.st-확정{background:var(--accent-weak);color:var(--accent)}.tag.st-완료{background:var(--ok-bg);color:var(--ok-fg)}.tag.st-취소{text-decoration:line-through}
main{min-width:0}
.empty{padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));color:var(--mute);max-width:680px}
.empty h2{color:var(--fg);font-size:18px;margin:0 0 8px}
.empty p{margin:0 0 10px}
.chead{display:flex;align-items:center;gap:12px;padding:14px 20px 0;flex-wrap:wrap}
.chead h2{margin:0;font-size:19px}
.chead .meta{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:2px;padding:10px 20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:1px solid transparent;border-bottom:none;background:none;padding:8px 14px;border-radius:6px 6px 0 0;color:var(--mute)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--fg);font-weight:700;margin-bottom:-1px}
.work{display:grid;grid-template-columns:minmax(320px,430px) minmax(0,1fr);gap:20px;padding:16px 20px 40px;align-items:start}
.formcol{display:flex;flex-direction:column;gap:14px;min-width:0}
fieldset{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 14px 14px;margin:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;padding:0 4px;font-size:13.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f,div.f{display:grid;gap:3px;font-size:12.5px;color:var(--mute);min-width:0}
label.f input,label.f select,label.f textarea,div.f>input{padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--field);color:var(--fg);width:100%;min-width:0}
label.f input[readonly],div.f>input[readonly]{background:transparent;border-style:dashed}
textarea{resize:vertical;min-height:52px}
.mapt{font-size:12.5px;color:var(--mute);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.previewcol{position:sticky;top:12px;min-width:0}
.previewcol .cap{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12.5px;margin-bottom:6px}
.pvwrap{background:var(--pv);border-radius:8px;padding:14px;overflow:hidden}
.pv{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);margin:0 auto;width:210mm}
.notice{background:var(--warn-bg);color:var(--warn-fg);padding:8px 12px;border-radius:6px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cform{padding:16px 20px;max-width:760px;display:grid;gap:14px}
table.ro{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.ro th,table.ro td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:top}
table.ro th{width:34%;color:var(--mute);font-weight:500;background:var(--bg)}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--panel);color:var(--fg)}
dialog::backdrop{background:rgba(10,16,24,.45)}
dialog .dh{padding:14px 18px;border-bottom:1px solid var(--line2);font-weight:700}
dialog .db{padding:14px 18px;display:grid;gap:10px;max-height:60vh;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
#pdfStage{position:fixed;left:-10000px;top:0;width:210mm;background:#fff}
#pdfStage .sheet{height:297mm;min-height:0;overflow:hidden}
@media (max-width:1100px){.work{grid-template-columns:minmax(0,1fr)}.previewcol{position:static}}
@media (max-width:760px){.body{grid-template-columns:minmax(0,1fr)}aside{max-height:42vh;position:static;border-right:none;border-bottom:1px solid var(--line)}.chead,.tabs,.work,.cform{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}


.tag.ct-무료체험,.tag.ct-무상임대,.tag.ct-경품,.tag.ct-무상증정{background:#efe2ff;color:#6b21a8}.tag.st-철거{background:#fde2e2;color:#b42318}

[hidden]{display:none!important}
.badge.remove{background:#fde2e2;color:#b42318}.badge.addon{background:#fff3c4;color:#8a5a00}.badge.as{background:#efe2ff;color:#6b21a8}
.sumt{border-collapse:collapse;font-size:13px;background:var(--panel)}
.sumt th,.sumt td{border:1px solid var(--line);padding:5px 12px;text-align:right;min-width:64px}
.sumt thead th{text-align:center;font-weight:700}
.sumt tbody th{text-align:left;font-weight:500;color:var(--mute);background:var(--panel)}
.sumt td.cl{cursor:pointer}.sumt td.cl:hover{background:var(--accent-weak)}.sumt td.on{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.sumt tr.open td,.sumt tr.open th{font-weight:700;background:var(--warn-bg);color:var(--warn-fg)}
.sumt .k-as{background:#efe2ff;color:#6b21a8}.sumt .k-install{background:var(--ok-bg);color:var(--ok-fg)}.sumt .k-remove{background:#fde2e2;color:#b42318}.sumt .k-addon{background:#fff3c4;color:#8a5a00}
.sumwrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:14px 20px 0}
.wt{border-collapse:separate;border-spacing:0;font-size:12.5px;background:var(--panel);white-space:nowrap}
.wt th{position:sticky;top:0;z-index:1;background:var(--line2);font-weight:700;padding:6px 7px;border-bottom:1px solid var(--line);text-align:left}
.wt td{padding:5px 7px;border-bottom:1px solid var(--line2);vertical-align:middle}
.wt tbody tr{cursor:pointer}.wt tbody tr:hover td{background:var(--accent-weak)}
.wt td.wrap{white-space:normal;min-width:160px;max-width:280px}
.wt td.kc{font-weight:700;text-align:center}
.wt .k-as{background:#efe2ff;color:#6b21a8}.wt .k-install{background:var(--ok-bg);color:var(--ok-fg)}.wt .k-remove{background:#fde2e2;color:#b42318}.wt .k-addon{background:#fff3c4;color:#8a5a00}
.wt td.due{color:var(--accent);font-weight:700}.wt td.late{color:var(--bad-fg);font-weight:700}
.wtbox{max-height:calc(100vh - 260px);overflow:auto;border:1px solid var(--line);border-radius:6px}
.sumt th{white-space:nowrap}
.wrapx.vis{overflow:visible}
.wt th.sortable{cursor:pointer}.wt th.sortable:hover{color:var(--accent)}.wt th[data-sort="asc"]::before{content:"▲ ";font-size:9px;color:var(--accent)}.wt th[data-sort="desc"]::before{content:"▼ ";font-size:9px;color:var(--accent)}
.pedit input,.pedit select{width:100%;min-width:0;padding:4px 6px;border:1px solid var(--accent);border-radius:5px;background:var(--field)}.pedit td{background:var(--accent-weak)}
.kpi.kc{cursor:pointer}.kpi.kc:hover{border-color:var(--accent)}.kpi.kc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak);background:var(--accent-weak)}
.gbadge{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:9px;margin-left:4px;vertical-align:1px;color:#fff}.gbadge.g-red{background:#e8590c}.gbadge.g-black{background:#1f1f1f}
.gwarn{margin:0;padding:6px 10px;border-radius:6px;font-size:13px;font-weight:600}.gwarn.g-red{background:#fff0e6;color:#b4410a}.gwarn.g-black{background:#2b2b2b;color:#fff}
#dlgF .gocust{margin-right:auto}
.trial.late{color:var(--bad-fg);font-weight:700}.trial.soon{color:var(--warn-fg);font-weight:700}
.autocalc{background:var(--ok-bg)!important;transition:background .3s}
.rofield{background:var(--line2)!important;color:var(--fg);cursor:default}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 20px;border:2px dashed transparent;border-radius:10px;margin:0 8px}
.fgrid.sm{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));padding:8px 0;margin:0}
.fgrid.drop{border-color:var(--accent);background:var(--accent-weak)}
.fth{position:relative;display:grid;grid-template-rows:1fr auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0;overflow:hidden;cursor:pointer;aspect-ratio:3/4;text-align:left;font:inherit;color:inherit}
.fth:hover,.fth:focus-visible{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
.fth img{width:100%;height:100%;object-fit:cover;min-height:0;background:var(--line2)}
.fpdf{display:grid;place-items:center;background:var(--line2);color:var(--mute);font-weight:700;font-size:18px;min-height:0;height:100%}
.fpdf.big{width:160px;height:200px;margin:0 auto 12px;border-radius:8px}
.fcap{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;font-size:12px;color:var(--mute);border-top:1px solid var(--line2)}.fcap b{color:var(--fg)}
.fx{position:absolute;top:4px;right:4px;z-index:1;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:22px;padding:0}
.nfiles{padding:8px 12px;border:1px solid var(--line);border-radius:8px}
#lbx{max-width:min(1100px,96vw);width:96vw;height:92vh;padding:0;background:#111;border:0;color:#eee}#lbx::backdrop{background:rgba(0,0,0,.75)}
#lbx .lbtop .btn{background:#2c2c2c;color:#fff;border-color:#555}#lbx .lbtop .btn.danger{color:#ff9b9b;border-color:#7a3b3b}
.fgrid.sm .fcap{display:block;line-height:1.35}.fgrid.sm .fcap b{display:block}
.lbwrap{display:grid;grid-template-rows:auto 1fr;height:100%}.lbtop{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#1d1d1d}.lbcap{font-size:14px}
.lbmid{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;min-height:0}.lbimg{height:100%;min-height:0;display:grid;place-items:center;text-align:center;overflow:auto;padding:8px}
.lbimg img{max-width:100%;max-height:calc(92vh - 80px);object-fit:contain}
.lbnav{height:80px;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:36px;border-radius:8px;margin:0 6px;cursor:pointer}.lbnav:disabled{opacity:.2;cursor:default}
.wt thead th{position:sticky}.wt .rz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:2;touch-action:none}
.wt .rz::after{content:"";position:absolute;left:3px;top:20%;height:60%;border-left:1px solid var(--line)}.wt .rz:hover::after{border-left:2px solid var(--accent)}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none}
.hastip{border-bottom:1px dashed currentColor;cursor:help;position:relative;padding-right:9px}
.hastip::after{content:"";position:absolute;right:0;top:1px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
#tipbox{position:fixed;z-index:1000;max-width:280px;background:#1f2937;color:#fff;font-size:13px;line-height:1.5;padding:7px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:pre-wrap;pointer-events:none}
.ksec{font-size:16px;font-weight:700;margin:14px 0 -2px;padding:2px 0 6px 10px;border-left:4px solid var(--accent);border-bottom:1px solid var(--line);color:var(--fg)}
#kf>.ksec:first-child{margin-top:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bizup{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--accent-weak)}
.bizup [data-pv],.bizup details{flex-basis:100%}.rawtxt{white-space:pre-wrap;font-size:12px;max-height:200px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;margin:4px 0 0}.bizup img{max-height:160px;max-width:100%;border:1px solid var(--line);border-radius:4px}
.bizrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}.bizrow .bizup{flex:1 1 100%}
@media (hover:hover) and (pointer:fine){.wtbox.hb{overflow-x:hidden}}

.wt.am tr.rs-완료:hover td,.wt.ct tr.rs-완료:hover td{background:#cfe4c2}.wt.am tr.rs-미수:hover td,.wt.ct tr.rs-미수:hover td{background:#ffdb70}.wt.am tr.rs-보류:hover td,.wt.am tr.rs-취소:hover td,.wt.ct tr.rs-철거:hover td,.wt.ct tr.rs-보류:hover td,.wt.ct tr.rs-취소:hover td{background:#c8c8c8}
.wt.am tr.rs-완료:hover td,.wt.ca tr.rs-완료:hover td{background:#cfe4c2}.wt.am tr.rs-미수:hover td,.wt.ca tr.rs-미수:hover td{background:#ffdb70}.wt.am tr.rs-보류:hover td,.wt.am tr.rs-취소:hover td,.wt.ca tr.rs-철거:hover td,.wt.ca tr.rs-보류:hover td,.wt.ca tr.rs-취소:hover td{background:#c8c8c8}

function fmtPhone(v){
  let d=String(v??"").replace(/\D/g,"");
  if(/^1\d{8,9}$/.test(d))d="0"+d;               // 엑셀에서 앞자리 0이 빠진 경우
  if(d.startsWith("02")){if(d.length===9)return d.replace(/(02)(\d{3})(\d{4})/,"$1-$2-$3");if(d.length===10)return d.replace(/(02)(\d{4})(\d{4})/,"$1-$2-$3")}

  if(d.length===8)return d.replace(/(\d{4})(\d{4})/,"$1-$2");
  return String(v??"").trim();

function toDate(v){const r=toDate0(v);if(!r)return"";const m=r.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return"";const y=+m[1],mo=+m[2],d=+m[3];if(y<1990||y>2100||mo<1||mo>12||d<1||d>31)return"";return r}
function toDate0(v){
  if(v==null||v==="")return"";
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}

  const s=String(v).trim();let m=s.match(/^(\d{4})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})/);
  if(m)return m[1]+"-"+p2(m[2])+"-"+p2(m[3]);
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/);if(m)return m[1]+"-"+m[2]+"-"+m[3];

  return "";
}

async function fetchAll(table,select="*"){
  /* id 순서로 1000줄씩 이어 받기 (앞 페이지를 건너뛰는 계산이 없어 서버 부담이 적음) */
  const step=1000;const key=table==="staff"?"user_id":table==="customer_grades"?"customer_id":"id";
  if(select!=="*"&&!select.split(",").includes(key))select+=","+key;
  const out=[];let last=null;
  for(;;){let q=sb.from(table).select(select).order(key).limit(step);if(last!==null)q=q.gt(key,last);
    const {data,error}=await q;if(error)throw error;out.push(...data);if(data.length<step)break;last=data[data.length-1][key]}
  return out;
}
/* 무거운 칸(엑셀 원본 import_raw)은 내려받지 않음 */
const COLS={};
async function colsOf(tb){if(COLS[tb])return COLS[tb];const {data,error}=await sb.from(tb).select("*").limit(1);if(error)throw error;
  COLS[tb]=data&&data[0]?Object.keys(data[0]).filter(k=>k!=="import_raw").join(","):"*";return COLS[tb]}

/* 바뀐 것만 받아오기: updated_at 이후 행 + 개수 확인(지워진 행 있으면 전체 다시) */
function maxUpd(arr){let m="";for(const r of arr)if(r.updated_at&&r.updated_at>m)m=r.updated_at;return m}
async function incFetch(tb,cur,full,withCount){const since=maxUpd(cur);if(!cur.length||!since)return{rows:await full(),changed:true};
  const sel=tb==="contracts"?await colsOf(tb):"*";
  /* 개수 확인(지운 행 찾기)은 직접 저장·삭제한 뒤에만. 자동 새로고침은 바뀐 행만 받고, 5분마다 전체 확인 */
  const [h,d]=await Promise.all([withCount?sb.from(tb).select("id",{count:"exact",head:true}):Promise.resolve({count:null}),sb.from(tb).select(sel).gt("updated_at",since)]);
  if(h.error)throw h.error;if(d.error)throw d.error;
  const m=new Map(cur.map(r=>[r.id,r]));let changed=false;
  for(const r of d.data){const o=m.get(r.id);if(!o||o.updated_at!==r.updated_at){m.set(r.id,r);changed=true}}
  if(h.count!=null&&m.size!==h.count)return{rows:await full(),changed:true};
  return{rows:changed?[...m.values()]:cur,changed}}

async function reload(tables,quiet){

  const INC={customers:()=>customers,contracts:()=>contracts,jobs:()=>jobs,payments:()=>(me.role==="tech"||ui.noPay)?null:payments,leads:()=>(me.role==="tech"||ui.noLeads)?null:leads};

    const d=await TBL[t]();const old={customers,contracts,jobs,staff,payments,files,grades,notes,leads,recv:rcases,rlogs}[t];chg[i]=JSON.stringify(old)!==JSON.stringify(d);return d}))}

/* 글자에서 항목 뽑기 (글자 사이 띄어쓰기·OCR 잡음 허용) */
function parseBizReg(raw){
  const L=s=>s.split("").map(ch=>ch.replace(/[()]/g,"\\$&")).join("\\s*");

  const dg=all.replace(/[oOㅇ]/g,"0").replace(/[lI|]/g,"1");const SEP="\\s*[-–—~.ㅡ一_=－\\s]\\s*";
  const nm=dg.match(/등\s*록\s*번\s*호\D{0,8}(\d{3})\D{0,4}(\d{2})\D{0,4}(\d{5})(?!\d)/)||dg.match(new RegExp("(?<!\\d)(\\d{3})"+SEP+"(\\d{2})"+SEP+"(\\d{5})(?!\\d)"));
  if(nm)out.biz=`${nm[1]}-${nm[2]}-${nm[3]}`;
  const FZ={"상":"[상삼샹]","호":"[호효흐]","성":"[성섬셩]","명":"[명멍맹멍]","대":"[대데]","표":"[표포]","자":"[자저]","소":"[소쇼]","재":"[재제]","지":"[지치]","업":"[업엄]","개":"[개게]","연":"[연언]","월":"[월윌]","일":"[일잃]","법":"[법볍]","인":"[인민]"};
  const after=(labels,stops)=>{for(const lb of labels){const re=new RegExp(lb.split("").map(ch=>FZ[ch]||ch.replace(/[()]/g,"\\$&")).join("\\s*")+"\\s*[:;：.,ㆍ·]?\\s*(.*)");for(let i=0;i<lines.length;i++){const m=lines[i].match(re);if(m&&m[1]!==undefined){let v=m[1];
    if(!v.replace(/[\s:;：.,ㆍ·]/g,"")&&lines[i+1]&&!/[:：]/.test(lines[i+1]))v=lines[i+1];
    for(const st of stops||[]){const k=v.search(new RegExp(L(st)));if(k>=0)v=v.slice(0,k)}v=v.replace(/^[\s:;：.]+|[\s:;：.]+$/g,"");if(v)return{v,i}}}}return null};
  const STOP=["생년월일","개업연월일","법인등록번호","사업장","성명","대표자","등록번호"];
  const sh=after(["법인명(단체명)","법인명","상호"],STOP);if(sh)out.name=sh.v.replace(/^\(?단체명\)?\s*/,"");
  const ce=after(["대표자","성명"],["생년월일","주민등록번호","개업"]);if(ce){const n=ce.v.replace(/[^가-힣\s]/g,"").trim();const z=n.replace(/\s/g,"");out.ceo=z.length<=5?z:n.split(" ")[0]}
  const od=all.match(new RegExp(L("개업연월일")+"\\D{0,6}(\\d{4})\\s*[년.\\-/]\\s*(\\d{1,2})\\s*[월.\\-/]\\s*(\\d{1,2})"));if(od)out.open=`${od[1]}-${od[2].padStart(2,"0")}-${od[3].padStart(2,"0")}`;
  const ad=after(["사업장소재지","사업장 소재지","소재지"],["본점소재지","사업의종류","업태"]);
  if(ad){let v=ad.v;const nx=lines[ad.i+1]||"";const lab=new RegExp("("+["본점","사업의","업태","종목","발급","공동","생년","전자","개업"].map(L).join("|")+")");
    if(nx&&!/[:：]/.test(nx)&&!lab.test(nx)&&nx.length<30&&!/(호|층|\))$/.test(v))v+=" "+nx;out.addr=v.replace(/\s{2,}/g," ").trim()}
  const ut=all.match(new RegExp(L("업태")+"\\s*[:：]?\\s*(.+?)\\s*"+L("종목")+"\\s*[:：]?\\s*([^\\n]+)"));if(ut){out.type=ut[1].trim();out.item=ut[2].trim()}
  else{const a=after(["업태"],["종목"]);if(a)out.type=a.v;const b=after(["종목"]);if(b)out.item=b.v}
  if(!out.type){const k=after(["사업의종류","사업의 종류"]);if(k){const w=k.v.replace(/^(업\s*태|종\s*목)\s*/,"").split(/\s+/);if(w[0]){out.type=w[0];if(w.length>1)out.item=w.slice(1).join(" ")}}}
  return out;
}

    if(!t("상호"))return;out.push({g,t})});return out}

const DKIND={as:"A/S",install:"설치",ctr:"계약",cust:"고객"};
function delRows(){
  const q=ui.dq.trim().toLowerCase().replace(/-/g,"");const has=t=>!q||String(t).toLowerCase().replace(/-/g,"").includes(q);
  if(ui.dkind==="as"||ui.dkind==="install")return jobs.filter(j=>j.kind===ui.dkind).map(j=>({id:j.id,date:j.request_date||"",title:j.customer_name,sub:[j.status,j.symptom,j.paid_type,j.cost?won0(j.cost)+"원":"",j.pay_status].filter(Boolean).join(" · ")})).filter(r=>has(r.title+" "+r.sub));
  if(ui.dkind==="ctr")return contracts.map(k=>{const c=custById(k.customer_id);return{id:k.id,date:k.contract_date||"",title:c?c.name:"",sub:[k.stage,k.product,k.size,k.serial&&"SN "+k.serial,k.amount?won0(k.amount)+"원":""].filter(Boolean).join(" · ")}}).filter(r=>has(r.title+" "+r.sub));
  return customers.map(c=>({id:c.id,date:(c.created_at||"").slice(0,10),title:c.name,sub:[c.ceo,c.phone||c.phone2,`계약 ${custContracts(c.id).length} · 작업 ${custJobs(c.id).length}`].filter(Boolean).join(" · ")})).filter(r=>has(r.title+" "+r.sub));
}
function renderDeleteView(){
  if(!isAdmin()){view().innerHTML=`<div class="empty"><h2>관리자만 쓸 수 있는 화면입니다</h2></div>`;return}
  const rows=delRows().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  [...ui.dsel].forEach(id=>{if(!rows.some(r=>r.id===id))ui.dsel.delete(id)});
  const shown=rows.slice(0,500);
  view().innerHTML=`<div class="toolbar"><h2 style="margin:0 8px 0 0;font-size:18px">삭제</h2>
    <div class="nav">${Object.entries(DKIND).map(([k,l])=>`<button type="button" data-dk="${k}" class="${ui.dkind===k?"on":""}">${l}</button>`).join("")}</div>
    <input id="dQ" type="search" placeholder="업체명(상호)·내용 검색" value="${esc(ui.dq)}"><span class="mapt">${rows.length}건 · 선택 ${ui.dsel.size}건</span><span style="flex:1"></span>
    <button class="btn danger" type="button" id="bDel" ${ui.dsel.size?"":"disabled"}>선택한 ${ui.dsel.size}건 삭제</button></div>
    <div class="sec" style="padding-bottom:0"><p class="mapt">${ui.dkind==="cust"?"고객을 지우면 그 고객의 계약·설치·A/S 기록도 함께 지워집니다.":ui.dkind==="ctr"?"계약을 지워도 연결된 설치·A/S 기록은 남습니다.":"지운 기록은 되돌릴 수 없습니다."} 삭제는 관리자만 할 수 있습니다.</p></div>
    <div class="wrapx"><table class="stafft"><thead><tr><th style="width:36px"><input type="checkbox" id="dAll" aria-label="전체 선택" ${shown.length&&shown.every(r=>ui.dsel.has(r.id))?"checked":""}></th><th>날짜</th><th>업체명(상호)</th><th>내용</th></tr></thead><tbody>
    ${shown.map(r=>`<tr><td><input type="checkbox" data-d="${r.id}" ${ui.dsel.has(r.id)?"checked":""} aria-label="선택"></td><td class="money">${esc(r.date)}</td><td>${esc(r.title)}</td><td>${esc(r.sub)}</td></tr>`).join("")||`<tr><td colspan="4" class="mapt">기록이 없습니다.</td></tr>`}
    </tbody></table>${rows.length>shown.length?`<p class="mapt">${rows.length-shown.length}건 더 있습니다. 검색으로 좁혀 주세요.</p>`:""}</div>`;
  view().querySelectorAll("[data-dk]").forEach(b=>b.onclick=()=>{ui.dkind=b.dataset.dk;ui.dsel=new Set();renderDeleteView()});
  const dq=document.getElementById("dQ");dq.oninput=e=>{ui.dq=e.target.value;clearTimeout(dq._t);dq._t=setTimeout(()=>{renderDeleteView();const n=document.getElementById("dQ");n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)};
  view().querySelectorAll("[data-d]").forEach(x=>x.onchange=()=>{x.checked?ui.dsel.add(x.dataset.d):ui.dsel.delete(x.dataset.d);renderDeleteView()});
  document.getElementById("dAll").onchange=e=>{shown.forEach(r=>e.target.checked?ui.dsel.add(r.id):ui.dsel.delete(r.id));renderDeleteView()};
  document.getElementById("bDel").onclick=()=>{const n=ui.dsel.size;const names=shown.filter(r=>ui.dsel.has(r.id)).slice(0,5).map(r=>esc(r.title)).join(", ");
    openDlg(`${DKIND[ui.dkind]} ${n}건 삭제`,`<p>${names}${n>5?` 외 ${n-5}건`:""}을(를) 삭제합니다.</p><p><b>되돌릴 수 없습니다.</b>${ui.dkind==="cust"?" 그 고객의 계약·설치·A/S 기록도 모두 지워집니다.":""}</p>`,
     [["취소"],["삭제","danger",async()=>{const tb=ui.dkind==="cust"?"customers":ui.dkind==="ctr"?"contracts":"jobs";const ids=[...ui.dsel];
       for(let i=0;i<ids.length;i+=200){const {error}=await sb.from(tb).delete().in("id",ids.slice(i,i+200));if(error)return toast("삭제하지 못했습니다: "+error.message)}
       ui.dsel=new Set();toast(`${n}건 삭제했습니다`);reload(["customers","contracts","jobs"])}]])};
}

function parseSheet(rows,hr){
  const H=rows[hr].map(h=>String(h||"").trim());
  const ix=(n,k=0)=>{let c=-1;for(let i=0;i<H.length;i++)if(H[i]===n&&++c===k)return i;return -1};
  if(ix("고객등록")<0){const b=ix("합계금액",2);if(b>=0&&!H[b+1]&&!H[b+2]&&!H[b+3]){H[b+1]="고객등록";H[b+2]="전표마감";H[b+3]="매출마감"}}
  const has=(n,k=0)=>ix(n,k)>=0;
  const out=[];
  rows.slice(hr+1).forEach(row=>{
    if(!row.some(v=>String(v).trim()!==""))return;
    const g=(n,k=0)=>{const i=ix(n,k);return i<0?"":row[i]};const t=(n,k=0)=>{const v=g(n,k);return v instanceof Date?toDate(v):String(v??"").trim()};
    if(!t("업체명"))return;
    const raw={};H.forEach((h,i)=>{if(!h)return;let key=h,n=2;while(key in raw)key=h+"#"+(n++);const v=row[i];raw[key]=v instanceof Date?toDate(v):v});
    out.push({t,g,raw,has});
  });
  return out;
}

async function runImport(plan,replace){
  try{
    if(replace){for(const tb of ["jobs","contracts","customers"]){const {error}=await sb.from(tb).delete().not("id","is",null);if(error)throw error}}
    const put=async(tb,rows)=>{for(let i=0;i<rows.length;i+=300){toast(`이관 중… ${{customers:"고객",contracts:"계약",jobs:"작업",payments:"입금"}[tb]} ${Math.min(i+300,rows.length)}/${rows.length}`);const {error}=await sb.from(tb).insert(rows.slice(i,i+300));if(error)throw error}};
    await put("customers",plan.newCust.map(({__new,...r})=>r));await put("contracts",plan.newCtr);await put("jobs",plan.newJob);
    const ups=plan.updCtr||[];for(let i=0;i<ups.length;i++){if(i%10===0)toast(`기존 계약 갱신 중… ${i+1}/${ups.length}`);const {error}=await sb.from("contracts").update(ups[i].patch).eq("id",ups[i].id);if(error)throw error}

    if(!ui.noPay){const touched=new Set(ups.map(u=>u.id));const bad=contracts.filter(k=>!touched.has(k.id)&&CTYPES.includes(k.channel||""));
      for(const k of bad){const {error}=await sb.from("contracts").update({channel:"",contract_type:(k.contract_type&&k.contract_type!=="구매")?k.contract_type:k.channel}).eq("id",k.id);if(error)throw error}}
    await sb.rpc("link_staff_names");
    toast(`이관 완료: 고객 ${plan.newCust.length} · 계약 ${plan.newCtr.length} · 작업 ${plan.newJob.length} · 입금 ${(plan.newPay||[]).length+(plan.updCtr||[]).reduce((a,u)=>a+u.pays.length,0)} · 갱신 ${(plan.updCtr||[]).length}`);
    ui.sel=null;await loadAll();

  return new Promise(ok=>{let done=false;const fin=v=>{if(done)return;done=true;d.close();ok(v)};
    document.getElementById("cfmYes").onclick=()=>fin(true);document.getElementById("cfmNo").onclick=()=>fin(false);
    d.oncancel=e=>{e.preventDefault();fin(false)};d.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();e.stopPropagation();fin(true)}};

/* 입력 중 Enter: 창이 닫히지 않게 막고, "저장하시겠습니까?"를 물은 뒤 저장 */

  if(e.key!=="Enter"||e.isComposing||e.defaultPrevented)return;const el=e.target;

  askConfirm(btn.textContent.trim()+"하시겠습니까?").then(y=>{if(y)btn.click();else el.focus()});
});
/* 고객정보 화면에서도 Enter는 확인 후 저장 */
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing||e.defaultPrevented)return;const el=e.target;const f=el.closest&&el.closest("#cf");
  if(!f||!el.matches("input,select")||["checkbox","radio","file"].includes(el.type))return;
  e.preventDefault();askConfirm("저장하시겠습니까?").then(y=>{if(y)f.requestSubmit();else el.focus()});
});
/* 싱크준비: 상태만 보이고, 메모가 있으면 마우스를 올렸을 때 메모 상자 */
function sinkCell(j){const s=esc(j.sink_status||""),m=String(j.sink_memo||"").trim();
  return m?`<span class="hastip" data-tip="${esc(m)}" tabindex="0">${s||"메모"}</span>`:s}
(function(){const box=document.createElement("div");box.id="tipbox";box.setAttribute("role","tooltip");box.hidden=true;document.body.appendChild(box);
  const show=el=>{box.textContent=el.dataset.tip;box.hidden=false;const r=el.getBoundingClientRect();const w=box.offsetWidth,h=box.offsetHeight;
    let x=r.left,y=r.bottom+6;if(x+w>innerWidth-8)x=innerWidth-8-w;if(y+h>innerHeight-8)y=r.top-h-6;box.style.left=Math.max(8,x)+"px";box.style.top=Math.max(8,y)+"px"};
  const hide=()=>{box.hidden=true};
  document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)show(el)});
  document.addEventListener("mouseout",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el&&!el.contains(e.relatedTarget))hide()});
  document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)show(el)});
  document.addEventListener("focusout",hide);document.addEventListener("scroll",hide,true);})();
/* 넓은 표: 화면 맨 아래에 붙는 가로 막대 (표의 가로 스크롤과 함께 움직임) */
function hbar(box){
  if(!box||box.nextElementSibling&&box.nextElementSibling.classList.contains("hbar"))return;
  const bar=document.createElement("div");bar.className="hbar";bar.setAttribute("aria-hidden","true");bar.innerHTML="<div></div>";box.after(bar);
  const sync=()=>{bar.firstChild.style.width=(box.scrollWidth+Math.max(0,box.offsetWidth-box.clientWidth))+"px";bar.hidden=box.scrollWidth<=box.clientWidth+1;if(Math.abs(bar.scrollLeft-box.scrollLeft)>1)bar.scrollLeft=box.scrollLeft};
  box.classList.add("hb");
  bar.addEventListener("scroll",()=>{if(Math.abs(box.scrollLeft-bar.scrollLeft)>1)box.scrollLeft=bar.scrollLeft});
  box.addEventListener("wheel",e=>{const dx=e.shiftKey&&!e.deltaX?e.deltaY:e.deltaX;if(!dx||box.scrollWidth<=box.clientWidth)return;
    const before=box.scrollLeft;box.scrollLeft+=dx;if(box.scrollLeft!==before){bar.scrollLeft=box.scrollLeft;e.preventDefault()}},{passive:false});
  box.addEventListener("scroll",()=>{if(Math.abs(bar.scrollLeft-box.scrollLeft)>1)bar.scrollLeft=box.scrollLeft});
  sync();if(window.ResizeObserver){const ro=new ResizeObserver(sync);ro.observe(box);const t=box.querySelector("table");if(t)ro.observe(t)}
}
function fdata(id){const root=document.getElementById(id);const els=[...root.querySelectorAll("[name]")];
  const one=n=>{const e=els.filter(x=>x.name===n);if(!e.length)return null;const x=e[0];if(x.type==="radio"){const r=e.find(y=>y.checked);return r?r.value:null}if(x.type==="checkbox")return x.checked?(x.value||"on"):null;return x.value};
  return{get:one,getAll:n=>els.filter(x=>x.name===n&&x.type==="checkbox"&&x.checked).map(x=>x.value)}}
function val(id){const el=document.getElementById(id);return el?el.value:""}
function openDlg(h,b,btns){
  const d=document.getElementById("dlg");document.getElementById("dlgH").innerHTML=h;document.getElementById("dlgB").innerHTML=b;
  const f=document.getElementById("dlgF");f.innerHTML="";
  btns.forEach(([t,cls,fn])=>{const x=document.createElement("button");x.className="btn "+(cls||"");x.textContent=t;x.onclick=async ev=>{ev.preventDefault();if(fn){const keep=await fn();if(keep===true)return}d.close()};f.appendChild(x)});
  if(!d.open)d.showModal();
}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3000);return true}
init();
</script>
